name: Importar jogos

on:
  push:
    paths:
      - 'imports/*.zip'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: importar-jogos
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Importar HTMLs dos ZIPs
        run: python scripts/import_games.py
      - name: Publicar arquivos importados
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add jogos games-imported.json
          if git diff --cached --quiet; then
            echo 'Nenhuma alteração para publicar.'
            exit 0
          fi
          git commit -m 'chore: importar jogos enviados em ZIP'
          git push
