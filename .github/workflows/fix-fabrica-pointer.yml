name: Corrigir Fábrica de Pintinhos

on:
  push:
    paths:
      - '.github/workflows/fix-fabrica-pointer.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Aplicar correção
        run: python scripts/fix_fabrica_drag.py
      - name: Publicar correção
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add jogos/fabrica-de-pintinhos.html
          if git diff --cached --quiet; then
            echo 'Nenhuma alteração para publicar.'
            exit 0
          fi
          git commit -m 'fix: corrigir mouse e arraste na Fábrica de Pintinhos'
          git push
