name: Auditoria mobile

on:
  push:
    paths:
      - 'scripts/mobile_audit_fix.py'
      - 'scripts/mobile_inspect.py'
      - 'scripts/patch_floresta_mobile.py'
      - '.github/workflows/mobile-audit.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: auditoria-mobile
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Aplicar controle touch na Floresta
        run: python scripts/patch_floresta_mobile.py
      - name: Auditar e aplicar correções mobile iniciais
        run: python scripts/mobile_audit_fix.py
      - name: Detalhar controles de teclado
        run: python scripts/mobile_inspect.py
      - name: Publicar ajustes e relatórios
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.js jogos/atravessa-a-rua.html data/floresta_bichinhos_escondidos.gz.b64 scripts/import_games.py MOBILE_AUDIT.md MOBILE_KEYBOARD_SNIPPETS.md
          if git diff --cached --quiet; then
            echo 'Nenhuma alteração para publicar.'
            exit 0
          fi
          git commit -m 'fix: melhorar controles no celular'
          git push
