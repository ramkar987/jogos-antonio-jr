<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Mesa de Ar</title>
<style>
  :root {
    --bg: #FFF8EC;
    --card-bg: #ffffff;
    --card-shadow: rgba(0,0,0,0.08);
    --title: #3C3489;
    --text-secondary: #888780;
    --text-primary: #2C2C2A;
    --btn-bg: #3C3489;
    --btn-bg-active: #26215C;
    --btn-text: #ffffff;
    --key-bg: #FAF8F2;
    --key-border: #E1DDCF;
    --key-text: #2C2C2A;
    --table-bg: #1D9E75;
    --table-line: rgba(255,255,255,0.6);
    --table-border: #0F6B4C;
    --goal-you: rgba(55, 138, 221, 0.55);
    --goal-cpu: rgba(226, 75, 74, 0.55);
    --puck: #2C2C2A;
    --puck-edge: #000000;
    --mallet-you: #378ADD;
    --mallet-you-edge: #185FA5;
    --mallet-cpu: #E24B4A;
    --mallet-cpu-edge: #993C1D;
    --score-you: #378ADD;
    --score-cpu: #E24B4A;
  }
  [data-theme="dark"] {
    --bg: #1C1B18;
    --card-bg: #26251F;
    --card-shadow: rgba(0,0,0,0.4);
    --title: #B4ACF2;
    --text-secondary: #A6A399;
    --text-primary: #F2F0E8;
    --btn-bg: #7F77DD;
    --btn-bg-active: #534AB7;
    --btn-text: #1C1B18;
    --key-bg: #322F28;
    --key-border: #47443B;
    --key-text: #F2F0E8;
    --table-bg: #0F5A40;
    --table-line: rgba(255,255,255,0.35);
    --table-border: #083A29;
    --goal-you: rgba(90, 161, 232, 0.6);
    --goal-cpu: rgba(216, 73, 58, 0.6);
    --puck: #F2F0E8;
    --puck-edge: #A6A399;
    --mallet-you: #5AA1E8;
    --mallet-you-edge: #2E6BAA;
    --mallet-cpu: #D8493A;
    --mallet-cpu-edge: #8C2E22;
    --score-you: #5AA1E8;
    --score-cpu: #D8493A;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0;
    padding: 0;
    min-height: 100%;
    background: var(--bg);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    transition: background .2s;
  }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 20px;
  }
  .card {
    position: relative;
    width: 100%;
    max-width: 420px;
    background: var(--card-bg);
    border-radius: 24px;
    box-shadow: 0 8px 30px var(--card-shadow);
    padding: 22px 20px 26px;
    text-align: center;
    transition: background .2s;
  }
  .theme-toggle {
    position: absolute;
    top: 16px;
    right: 16px;
    width: 38px;
    height: 38px;
    border-radius: 50%;
    border: 2px solid var(--key-border);
    background: var(--key-bg);
    color: var(--key-text);
    font-size: 18px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    touch-action: manipulation;
    z-index: 6;
  }
  h1 {
    font-size: 22px;
    margin: 0 0 4px;
    color: var(--title);
  }
  .subtitle {
    font-size: 13px;
    color: var(--text-secondary);
    margin: 0 0 12px;
  }

  .scoreboard {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 20px;
    margin-bottom: 12px;
  }
  .score-block { text-align: center; }
  .score-label { font-size: 12px; color: var(--text-secondary); }
  .score-value { font-size: 30px; font-weight: 700; }
  .score-value.you { color: var(--score-you); }
  .score-value.cpu { color: var(--score-cpu); }
  .score-sep { font-size: 20px; color: var(--text-secondary); }

  .status {
    font-size: 14px;
    font-weight: 600;
    color: var(--text-primary);
    min-height: 20px;
    margin-bottom: 12px;
  }

  .table-wrap {
    width: 100%;
    aspect-ratio: 5 / 7;
    max-height: 62vh;
    margin: 0 auto 16px;
    position: relative;
    touch-action: none;
  }
  #table-svg {
    width: 100%;
    height: 100%;
    display: block;
    border-radius: 16px;
  }

  .start-btn {
    width: 100%;
    padding: 15px;
    font-size: 17px;
    font-weight: 700;
    border-radius: 16px;
    border: none;
    background: var(--btn-bg);
    color: var(--btn-text);
    cursor: pointer;
    transition: background .15s, transform .1s;
    touch-action: manipulation;
  }
  .start-btn:active { transform: scale(0.97); background: var(--btn-bg-active); }
</style>
</head>
<body>

<div class="card">
  <button class="theme-toggle" id="theme-toggle" aria-label="Alternar modo escuro">🌙</button>
  <h1>Mesa de Ar</h1>
  <p class="subtitle">Arraste seu taco azul para rebater o disco. Quem fizer 7 gols primeiro vence!</p>

  <div class="scoreboard">
    <div class="score-block">
      <div class="score-label">Você</div>
      <div class="score-value you" id="score-you">0</div>
    </div>
    <div class="score-sep">×</div>
    <div class="score-block">
      <div class="score-label">Computador</div>
      <div class="score-value cpu" id="score-cpu">0</div>
    </div>
  </div>

  <div class="status" id="status">Toque em iniciar</div>

  <div class="table-wrap" id="table-wrap">
    <svg id="table-svg" viewBox="0 0 100 140"></svg>
  </div>

  <button class="start-btn" id="start">Iniciar jogo</button>
</div>

<script>
(function(){
  // Modo escuro
  const themeToggle = document.getElementById('theme-toggle');
  function applyTheme(theme){
    document.documentElement.setAttribute('data-theme', theme);
    themeToggle.textContent = theme === 'dark' ? '☀️' : '🌙';
    try { localStorage.setItem('airhockey-theme', theme); } catch(e) {}
  }
  let savedTheme = '';
  try { savedTheme = localStorage.getItem('airhockey-theme') || ''; } catch(e) {}
  if (savedTheme === 'dark' || (!savedTheme && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches)){
    applyTheme('dark');
  } else {
    applyTheme(savedTheme === 'dark' ? 'dark' : 'light');
  }
  themeToggle.addEventListener('click', () => {
    const current = document.documentElement.getAttribute('data-theme');
    applyTheme(current === 'dark' ? 'light' : 'dark');
  });

  const AudioCtx = window.AudioContext || window.webkitAudioContext;
  let actx = null;
  function getActx(){ if (!actx) actx = new AudioCtx(); return actx; }
  function playHit(){
    const c = getActx();
    const osc = c.createOscillator();
    const gain = c.createGain();
    osc.type = 'triangle';
    osc.frequency.setValueAtTime(400, c.currentTime);
    gain.gain.setValueAtTime(0.0001, c.currentTime);
    gain.gain.linearRampToValueAtTime(0.2, c.currentTime + 0.01);
    gain.gain.exponentialRampToValueAtTime(0.0001, c.currentTime + 0.1);
    osc.connect(gain).connect(c.destination);
    osc.start(); osc.stop(c.currentTime + 0.1);
  }
  function playWall(){
    const c = getActx();
    const osc = c.createOscillator();
    const gain = c.createGain();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(220, c.currentTime);
    gain.gain.setValueAtTime(0.0001, c.currentTime);
    gain.gain.linearRampToValueAtTime(0.1, c.currentTime + 0.01);
    gain.gain.exponentialRampToValueAtTime(0.0001, c.currentTime + 0.08);
    osc.connect(gain).connect(c.destination);
    osc.start(); osc.stop(c.currentTime + 0.08);
  }
  function playGoal(){
    const c = getActx();
    [0,4,7,12].forEach((semi,i) => {
      const osc = c.createOscillator();
      const gain = c.createGain();
      osc.type = 'sine';
      osc.frequency.value = 300 * Math.pow(2, semi/12);
      const t0 = c.currentTime + i*0.08;
      gain.gain.setValueAtTime(0.0001, t0);
      gain.gain.linearRampToValueAtTime(0.22, t0+0.02);
      gain.gain.exponentialRampToValueAtTime(0.0001, t0+0.22);
      osc.connect(gain).connect(c.destination);
      osc.start(t0); osc.stop(t0+0.22);
    });
  }
  function playWin(){
    const c = getActx();
    [0,4,7,12,16].forEach((semi,i) => {
      const osc = c.createOscillator();
      const gain = c.createGain();
      osc.type = 'sine';
      osc.frequency.value = 260 * Math.pow(2, semi/12);
      const t0 = c.currentTime + i*0.1;
      gain.gain.setValueAtTime(0.0001, t0);
      gain.gain.linearRampToValueAtTime(0.25, t0+0.02);
      gain.gain.exponentialRampToValueAtTime(0.0001, t0+0.3);
      osc.connect(gain).connect(c.destination);
      osc.start(t0); osc.stop(t0+0.3);
    });
  }

  const tableWrap = document.getElementById('table-wrap');
  const svg = document.getElementById('table-svg');
  const statusEl = document.getElementById('status');
  const startBtn = document.getElementById('start');
  const scoreYouEl = document.getElementById('score-you');
  const scoreCpuEl = document.getElementById('score-cpu');

  const W = 100, H = 140;
  const GOAL_WIDTH = 32;
  const MALLET_R = 7;
  const PUCK_R = 4.5;
  const WIN_SCORE = 7;

  let puck = { x: W/2, y: H/2, vx: 0, vy: 0 };
  let youMallet = { x: W/2, y: H - 20 };
  let cpuMallet = { x: W/2, y: 20 };
  let prevYouMallet = { x: youMallet.x, y: youMallet.y };
  let scoreYou = 0, scoreCpu = 0;
  let gameActive = false;
  let dragging = false;
  let dragTouchId = null;
  let rafId = null;
  let lastTime = null;

  function rand(min, max){ return Math.random() * (max - min) + min; }

  function resetPuck(direction){
    puck.x = W/2;
    puck.y = H/2;
    const angle = rand(-0.5, 0.5);
    const speed = 0.28;
    puck.vx = Math.sin(angle) * speed;
    puck.vy = Math.cos(angle) * speed * direction;
  }

  function drawTable(){
    let content = '';
    content += '<rect x="0" y="0" width="' + W + '" height="' + H + '" fill="var(--table-bg)" rx="16"/>';
    content += '<line x1="0" y1="' + (H/2) + '" x2="' + W + '" y2="' + (H/2) + '" stroke="var(--table-line)" stroke-width="1" stroke-dasharray="3,3"/>';
    content += '<circle cx="' + (W/2) + '" cy="' + (H/2) + '" r="14" fill="none" stroke="var(--table-line)" stroke-width="1"/>';
    content += '<rect x="' + (W/2 - GOAL_WIDTH/2) + '" y="0" width="' + GOAL_WIDTH + '" height="5.5" fill="var(--goal-cpu)" stroke="var(--mallet-cpu-edge)" stroke-width="1"/>';
    content += '<rect x="' + (W/2 - GOAL_WIDTH/2) + '" y="' + (H-5.5) + '" width="' + GOAL_WIDTH + '" height="5.5" fill="var(--goal-you)" stroke="var(--mallet-you-edge)" stroke-width="1"/>';
    content += '<rect x="1" y="1" width="' + (W-2) + '" height="' + (H-2) + '" fill="none" stroke="var(--table-border)" stroke-width="2" rx="15"/>';

    content += '<circle cx="' + cpuMallet.x + '" cy="' + cpuMallet.y + '" r="' + MALLET_R + '" fill="var(--mallet-cpu)" stroke="var(--mallet-cpu-edge)" stroke-width="1.5"/>';
    content += '<circle cx="' + cpuMallet.x + '" cy="' + cpuMallet.y + '" r="' + (MALLET_R*0.4) + '" fill="var(--mallet-cpu-edge)"/>';

    content += '<circle cx="' + puck.x + '" cy="' + puck.y + '" r="' + PUCK_R + '" fill="var(--puck)" stroke="var(--puck-edge)" stroke-width="1"/>';

    content += '<circle cx="' + youMallet.x + '" cy="' + youMallet.y + '" r="' + MALLET_R + '" fill="var(--mallet-you)" stroke="var(--mallet-you-edge)" stroke-width="1.5"/>';
    content += '<circle cx="' + youMallet.x + '" cy="' + youMallet.y + '" r="' + (MALLET_R*0.4) + '" fill="var(--mallet-you-edge)"/>';

    svg.innerHTML = content;
  }

  function getSvgPoint(clientX, clientY){
    const rect = tableWrap.getBoundingClientRect();
    const relX = (clientX - rect.left) / rect.width * W;
    const relY = (clientY - rect.top) / rect.height * H;
    return { x: relX, y: relY };
  }

  function clampMalletToHalf(pos){
    pos.x = Math.max(MALLET_R, Math.min(W - MALLET_R, pos.x));
    pos.y = Math.max(H/2 + MALLET_R, Math.min(H - MALLET_R, pos.y));
  }

  function handlePointerDown(e){
    if (!gameActive) return;
    let clientX, clientY;
    if (e.type === 'touchstart'){
      const t = e.changedTouches[0];
      clientX = t.clientX; clientY = t.clientY;
      dragTouchId = t.identifier;
    } else {
      clientX = e.clientX; clientY = e.clientY;
    }
    const p = getSvgPoint(clientX, clientY);
    const dx = p.x - youMallet.x, dy = p.y - youMallet.y;
    if (Math.sqrt(dx*dx+dy*dy) < MALLET_R * 2.5){
      dragging = true;
    }
    e.preventDefault();
  }

  function handlePointerMove(e){
    if (!gameActive || !dragging) return;
    let clientX, clientY;
    if (e.type === 'touchmove'){
      let t = null;
      for (let i = 0; i < e.changedTouches.length; i++){
        if (e.changedTouches[i].identifier === dragTouchId){ t = e.changedTouches[i]; break; }
      }
      if (!t) t = e.changedTouches[0];
      if (!t) return;
      clientX = t.clientX; clientY = t.clientY;
    } else {
      clientX = e.clientX; clientY = e.clientY;
    }
    const p = getSvgPoint(clientX, clientY);
    youMallet.x = p.x;
    youMallet.y = p.y;
    clampMalletToHalf(youMallet);
    e.preventDefault();
  }

  function handlePointerUp(){
    dragging = false;
    dragTouchId = null;
  }

  tableWrap.addEventListener('mousedown', handlePointerDown);
  window.addEventListener('mousemove', handlePointerMove);
  window.addEventListener('mouseup', handlePointerUp);
  tableWrap.addEventListener('touchstart', handlePointerDown, { passive: false });
  window.addEventListener('touchmove', handlePointerMove, { passive: false });
  window.addEventListener('touchend', handlePointerUp);
  window.addEventListener('touchcancel', handlePointerUp);

  function computerAI(dt){
    // limita o alvo em X para nunca tentar ficar exatamente sobre o disco perto das bordas,
    // evitando que o disco fique preso entre o taco e a parede
    const targetX = Math.max(MALLET_R + 3, Math.min(W - MALLET_R - 3, puck.x));
    let targetY = 20;

    if (puck.y < H/2 && puck.vy < 0){
      targetY = Math.max(MALLET_R + 2, Math.min(H/2 - MALLET_R, puck.y));
    } else {
      targetY = 20;
    }

    const speed = 0.05 * dt;
    const dx = targetX - cpuMallet.x;
    const dy = targetY - cpuMallet.y;
    const dist = Math.sqrt(dx*dx + dy*dy);
    if (dist > 0.5){
      cpuMallet.x += (dx / dist) * Math.min(speed, dist);
      cpuMallet.y += (dy / dist) * Math.min(speed, dist);
    }

    cpuMallet.x = Math.max(MALLET_R, Math.min(W - MALLET_R, cpuMallet.x));
    cpuMallet.y = Math.max(MALLET_R, Math.min(H/2 - MALLET_R, cpuMallet.y));
  }

  function reflectOffMallet(mallet, malletVX, malletVY){
    const dx = puck.x - mallet.x, dy = puck.y - mallet.y;
    const dist = Math.sqrt(dx*dx + dy*dy);
    const minDist = MALLET_R + PUCK_R;
    if (dist < minDist){
      // dist pode ser 0 exato (centro sobreposto) - usa direção aleatória nesse caso raro
      let nx, ny;
      if (dist > 0.01){
        nx = dx / dist; ny = dy / dist;
      } else {
        const randAngle = rand(0, Math.PI * 2);
        nx = Math.cos(randAngle); ny = Math.sin(randAngle);
      }

      const overlap = minDist - dist + 0.3; // margem extra pra garantir separação real
      puck.x += nx * overlap;
      puck.y += ny * overlap;

      // trava a posição dentro da mesa mesmo após o empurrão (evita ficar preso saindo pela parede)
      puck.x = Math.max(PUCK_R + 0.5, Math.min(W - PUCK_R - 0.5, puck.x));
      puck.y = Math.max(PUCK_R + 0.5, Math.min(H - PUCK_R - 0.5, puck.y));

      const speed = Math.sqrt(puck.vx*puck.vx + puck.vy*puck.vy);
      const minSpeed = 0.3;
      puck.vx = nx * Math.max(speed, minSpeed) + malletVX * 0.32;
      puck.vy = ny * Math.max(speed, minSpeed) + malletVY * 0.32;
      playHit();
      return true;
    }
    return false;
  }

  function physicsStep(dt){
    computerAI(dt);

    const youVX = (youMallet.x - prevYouMallet.x);
    const youVY = (youMallet.y - prevYouMallet.y);

    puck.x += puck.vx * dt;
    puck.y += puck.vy * dt;

    puck.vx *= 0.999;
    puck.vy *= 0.999;

    if (puck.x - PUCK_R < 0){
      puck.x = PUCK_R;
      puck.vx = Math.abs(puck.vx);
      playWall();
    } else if (puck.x + PUCK_R > W){
      puck.x = W - PUCK_R;
      puck.vx = -Math.abs(puck.vx);
      playWall();
    }

    const inGoalXRange = puck.x > W/2 - GOAL_WIDTH/2 && puck.x < W/2 + GOAL_WIDTH/2;

    if (puck.y - PUCK_R < 0){
      if (inGoalXRange){
        scoreYou++;
        scoreYouEl.textContent = scoreYou;
        playGoal();
        checkWinOrContinue();
        return;
      } else {
        puck.y = PUCK_R;
        puck.vy = Math.abs(puck.vy);
        playWall();
      }
    } else if (puck.y + PUCK_R > H){
      if (inGoalXRange){
        scoreCpu++;
        scoreCpuEl.textContent = scoreCpu;
        playGoal();
        checkWinOrContinue();
        return;
      } else {
        puck.y = H - PUCK_R;
        puck.vy = -Math.abs(puck.vy);
        playWall();
      }
    }

    reflectOffMallet(youMallet, youVX, youVY);
    reflectOffMallet(cpuMallet, 0, 0);

    const maxSpeed = 0.7;
    const curSpeed = Math.sqrt(puck.vx*puck.vx + puck.vy*puck.vy);
    if (curSpeed > maxSpeed){
      puck.vx = (puck.vx / curSpeed) * maxSpeed;
      puck.vy = (puck.vy / curSpeed) * maxSpeed;
    }

    prevYouMallet = { x: youMallet.x, y: youMallet.y };
  }

  function checkWinOrContinue(){
    if (scoreYou >= WIN_SCORE || scoreCpu >= WIN_SCORE){
      finishGame();
      return;
    }
    gameActive = false;
    setTimeout(() => {
      resetPuck(scoreYou > scoreCpu ? -1 : 1);
      gameActive = true;
      statusEl.textContent = 'Bora! Rebata o disco';
    }, 800);
  }

  function finishGame(){
    gameActive = false;
    if (scoreYou > scoreCpu){
      playWin();
      statusEl.textContent = 'Você venceu por ' + scoreYou + ' a ' + scoreCpu + '! 🎉';
    } else {
      statusEl.textContent = 'O computador venceu por ' + scoreCpu + ' a ' + scoreYou + '. Tente de novo!';
    }
    startBtn.textContent = 'Jogar de novo';
  }

  function loop(ts){
    if (!lastTime) lastTime = ts;
    const dt = Math.min(ts - lastTime, 32);
    lastTime = ts;

    if (gameActive){
      physicsStep(dt);
    }
    drawTable();

    rafId = requestAnimationFrame(loop);
  }

  function startGame(){
    scoreYou = 0; scoreCpu = 0;
    scoreYouEl.textContent = '0';
    scoreCpuEl.textContent = '0';
    youMallet = { x: W/2, y: H - 20 };
    cpuMallet = { x: W/2, y: 20 };
    prevYouMallet = { x: youMallet.x, y: youMallet.y };
    resetPuck(Math.random() < 0.5 ? 1 : -1);
    gameActive = true;
    lastTime = null;
    statusEl.textContent = 'Bora! Rebata o disco';
    startBtn.textContent = 'Reiniciar';
  }

  startBtn.addEventListener('click', () => {
    const c = getActx();
    if (c.state === 'suspended') c.resume();
    startGame();
  });

  // desenho inicial estático + loop sempre rodando (mesmo parado, pra manter render responsivo)
  drawTable();
  rafId = requestAnimationFrame(loop);
})();
</script>

</body>
</html>
