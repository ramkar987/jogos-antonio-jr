<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Resta Um</title>
<style>
  :root {
    --bg: #FFF8EC;
    --card-bg: #ffffff;
    --card-shadow: rgba(0,0,0,0.08);
    --title: #3C3489;
    --text-secondary: #888780;
    --text-primary: #2C2C2A;
    --btn-bg: #3C3489;
    --btn-bg-active: #26215C;
    --btn-text: #ffffff;
    --key-bg: #FAF8F2;
    --key-border: #E1DDCF;
    --key-text: #2C2C2A;
    --board-bg: #B5824C;
    --board-border: #7A5A32;
    --hole-empty: #8C6636;
    --hole-empty-border: #6B4A28;
    --piece: #378ADD;
    --piece-edge: #185FA5;
    --piece-movable: #EF9F27;
    --piece-movable-edge: #B5730E;
    --selected-ring: #639922;
    --move-target: rgba(99, 153, 34, 0.5);
  }
  [data-theme="dark"] {
    --bg: #1C1B18;
    --card-bg: #26251F;
    --card-shadow: rgba(0,0,0,0.4);
    --title: #B4ACF2;
    --text-secondary: #A6A399;
    --text-primary: #F2F0E8;
    --btn-bg: #7F77DD;
    --btn-bg-active: #534AB7;
    --btn-text: #1C1B18;
    --key-bg: #322F28;
    --key-border: #47443B;
    --key-text: #F2F0E8;
    --board-bg: #6B4A28;
    --board-border: #40290F;
    --hole-empty: #4A3319;
    --hole-empty-border: #2E1F0F;
    --piece: #5AA1E8;
    --piece-edge: #2E6BAA;
    --piece-movable: #F0B24A;
    --piece-movable-edge: #B5730E;
    --selected-ring: #7BAF3A;
    --move-target: rgba(123, 175, 58, 0.6);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0;
    padding: 0;
    min-height: 100%;
    background: var(--bg);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    transition: background .2s;
  }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 20px;
  }
  .card {
    position: relative;
    width: 100%;
    max-width: 420px;
    background: var(--card-bg);
    border-radius: 24px;
    box-shadow: 0 8px 30px var(--card-shadow);
    padding: 22px 20px 26px;
    text-align: center;
    transition: background .2s;
  }
  .theme-toggle {
    position: absolute;
    top: 16px;
    right: 16px;
    width: 38px;
    height: 38px;
    border-radius: 50%;
    border: 2px solid var(--key-border);
    background: var(--key-bg);
    color: var(--key-text);
    font-size: 18px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    touch-action: manipulation;
  }
  h1 {
    font-size: 22px;
    margin: 0 0 4px;
    color: var(--title);
  }
  .subtitle {
    font-size: 13px;
    color: var(--text-secondary);
    margin: 0 0 14px;
  }

  .stats {
    display: flex;
    justify-content: center;
    gap: 28px;
    margin-bottom: 10px;
  }
  .stat-label {
    font-size: 12px;
    color: var(--text-secondary);
    margin-bottom: 2px;
  }
  .stat-value {
    font-size: 20px;
    font-weight: 700;
    color: var(--text-primary);
  }

  .status {
    font-size: 15px;
    font-weight: 600;
    color: var(--text-primary);
    min-height: 22px;
    margin-bottom: 12px;
  }

  .board-wrap {
    width: 100%;
    max-width: 320px;
    margin: 0 auto 18px;
  }
  .board {
    background: var(--board-bg);
    border: 3px solid var(--board-border);
    border-radius: 14px;
    padding: 8px;
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    grid-template-rows: repeat(7, 1fr);
    gap: 4px;
    aspect-ratio: 1 / 1;
  }
  .hole {
    position: relative;
    border-radius: 50%;
    background: var(--hole-empty);
    border: 2px solid var(--hole-empty-border);
  }
  .hole.blank {
    background: transparent;
    border: none;
  }
  .hole.move-target::after {
    content: "";
    position: absolute;
    inset: 22%;
    border-radius: 50%;
    background: var(--move-target);
  }
  .peg {
    position: absolute;
    inset: 10%;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, var(--piece), var(--piece-edge));
    border: 2px solid var(--piece-edge);
    cursor: pointer;
    transition: transform .12s;
  }
  .peg.movable {
    background: radial-gradient(circle at 35% 30%, var(--piece-movable), var(--piece-movable-edge));
    border-color: var(--piece-movable-edge);
  }
  .peg.selected {
    box-shadow: 0 0 0 3px var(--selected-ring);
    transform: scale(1.08);
  }
  .peg:active { transform: scale(0.92); }

  .start-btn {
    width: 100%;
    padding: 15px;
    font-size: 17px;
    font-weight: 700;
    border-radius: 16px;
    border: none;
    background: var(--btn-bg);
    color: var(--btn-text);
    cursor: pointer;
    transition: background .15s, transform .1s;
    touch-action: manipulation;
  }
  .start-btn:active { transform: scale(0.97); background: var(--btn-bg-active); }
</style>
</head>
<body>

<div class="card">
  <button class="theme-toggle" id="theme-toggle" aria-label="Alternar modo escuro">🌙</button>
  <h1>Resta Um</h1>
  <p class="subtitle">Pule uma peça sobre a outra para capturá-la</p>

  <div class="stats">
    <div>
      <div class="stat-label">Peças restantes</div>
      <div class="stat-value" id="pegs-left">32</div>
    </div>
    <div>
      <div class="stat-label">Jogadas possíveis</div>
      <div class="stat-value" id="moves-left">4</div>
    </div>
  </div>

  <div class="status" id="status">Toque em iniciar</div>

  <div class="board-wrap">
    <div class="board" id="board"></div>
  </div>

  <button class="start-btn" id="start">Iniciar jogo</button>
</div>

<script>
(function(){
  // Modo escuro
  const themeToggle = document.getElementById('theme-toggle');
  function applyTheme(theme){
    document.documentElement.setAttribute('data-theme', theme);
    themeToggle.textContent = theme === 'dark' ? '☀️' : '🌙';
    try { localStorage.setItem('restaum-theme', theme); } catch(e) {}
  }
  let savedTheme = '';
  try { savedTheme = localStorage.getItem('restaum-theme') || ''; } catch(e) {}
  if (savedTheme === 'dark' || (!savedTheme && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches)){
    applyTheme('dark');
  } else {
    applyTheme(savedTheme === 'dark' ? 'dark' : 'light');
  }
  themeToggle.addEventListener('click', () => {
    const current = document.documentElement.getAttribute('data-theme');
    applyTheme(current === 'dark' ? 'light' : 'dark');
  });

  const boardEl = document.getElementById('board');
  const statusEl = document.getElementById('status');
  const startBtn = document.getElementById('start');
  const pegsLeftEl = document.getElementById('pegs-left');
  const movesLeftEl = document.getElementById('moves-left');

  const SIZE = 7;
  // grid[r][c] = 'peg' | 'empty' | 'blank' (fora do tabuleiro, formato 7x7 simplificado = todas jogáveis)
  let grid = [];
  let selected = null;
  let gameActive = false;

  function setupGrid(){
    grid = [];
    for (let r = 0; r < SIZE; r++){
      const row = [];
      for (let c = 0; c < SIZE; c++){
        row.push('peg');
      }
      grid.push(row);
    }
    // centro começa vazio
    grid[3][3] = 'empty';
  }

  function inBounds(r, c){ return r >= 0 && r < SIZE && c >= 0 && c < SIZE; }

  function getMovesForPeg(r, c){
    if (grid[r][c] !== 'peg') return [];
    const dirs = [[-1,0],[1,0],[0,-1],[0,1]];
    const moves = [];
    dirs.forEach(([dr, dc]) => {
      const mr = r + dr, mc = c + dc;   // peça do meio (capturada)
      const tr = r + dr*2, tc = c + dc*2; // destino
      if (inBounds(tr, tc) && grid[mr][mc] === 'peg' && grid[tr][tc] === 'empty'){
        moves.push({ r: tr, c: tc, capR: mr, capC: mc });
      }
    });
    return moves;
  }

  function getAllMovablePegs(){
    const result = [];
    for (let r = 0; r < SIZE; r++){
      for (let c = 0; c < SIZE; c++){
        if (grid[r][c] === 'peg'){
          const moves = getMovesForPeg(r, c);
          if (moves.length > 0) result.push({ r, c, moves });
        }
      }
    }
    return result;
  }

  function countPegs(){
    let count = 0;
    for (let r = 0; r < SIZE; r++){
      for (let c = 0; c < SIZE; c++){
        if (grid[r][c] === 'peg') count++;
      }
    }
    return count;
  }

  function totalMovesAvailable(movable){
    return movable.reduce((sum, p) => sum + p.moves.length, 0);
  }

  function renderBoard(){
    boardEl.innerHTML = '';
    const movable = gameActive ? getAllMovablePegs() : [];
    const movableSet = new Set(movable.map(p => p.r + ',' + p.c));

    let selectedMoves = [];
    if (selected){
      const found = movable.find(p => p.r === selected.r && p.c === selected.c);
      if (found) selectedMoves = found.moves;
    }

    for (let r = 0; r < SIZE; r++){
      for (let c = 0; c < SIZE; c++){
        const cellState = grid[r][c];
        const hole = document.createElement('div');
        hole.className = 'hole';

        if (selectedMoves.some(m => m.r === r && m.c === c)){
          hole.classList.add('move-target');
        }

        if (cellState === 'peg'){
          const peg = document.createElement('div');
          const isMovable = movableSet.has(r + ',' + c);
          peg.className = 'peg' + (isMovable ? ' movable' : '') + (selected && selected.r === r && selected.c === c ? ' selected' : '');
          peg.addEventListener('click', () => handlePegClick(r, c));
          hole.appendChild(peg);
        } else {
          hole.addEventListener('click', () => handleHoleClick(r, c));
        }

        boardEl.appendChild(hole);
      }
    }

    const pegs = countPegs();
    const movesCount = totalMovesAvailable(movable);
    pegsLeftEl.textContent = pegs;
    movesLeftEl.textContent = movesCount;
  }

  function handlePegClick(r, c){
    if (!gameActive) return;
    const moves = getMovesForPeg(r, c);
    if (moves.length === 0){
      statusEl.textContent = 'Essa peça não pode se mover agora';
      return;
    }
    selected = { r, c };
    statusEl.textContent = 'Escolha para onde pular';
    renderBoard();
  }

  function handleHoleClick(r, c){
    if (!gameActive || !selected) return;
    const moves = getMovesForPeg(selected.r, selected.c);
    const target = moves.find(m => m.r === r && m.c === c);
    if (!target) return;

    grid[selected.r][selected.c] = 'empty';
    grid[target.capR][target.capC] = 'empty';
    grid[r][c] = 'peg';
    selected = null;

    renderBoard();
    checkGameState();
  }

  function checkGameState(){
    const pegs = countPegs();
    const movable = getAllMovablePegs();
    const movesCount = totalMovesAvailable(movable);

    if (movesCount === 0){
      gameActive = false;
      if (pegs === 1){
        statusEl.textContent = 'Incrível! Você terminou com só 1 peça! 🎉';
      } else {
        statusEl.textContent = 'Sem mais jogadas! Restaram ' + pegs + ' peças. Tente de novo!';
      }
      startBtn.textContent = 'Jogar de novo';
      return;
    }

    statusEl.textContent = 'Continue jogando! Restam ' + pegs + ' peças';
  }

  function startGame(){
    setupGrid();
    selected = null;
    gameActive = true;
    statusEl.textContent = 'Toque numa peça para começar';
    startBtn.textContent = 'Reiniciar';
    renderBoard();
  }

  startBtn.addEventListener('click', startGame);

  // desenho inicial estático
  setupGrid();
  renderBoard();
})();
</script>

</body>
</html>
