<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Jogos do Antônio Jr.</title>
<style>
:root{--bg:#f6f4ec;--card:#fff;--text:#25231f;--muted:#77736b;--line:#ded9ce;--p:#3c3489;--p2:#6f67c7;--good:#639922;--bad:#e24b4a;--gold:#ef9f27;--blue:#378add} [data-theme=dark]{--bg:#181817;--card:#262522;--text:#f4f1e9;--muted:#aaa69c;--line:#45423b;--p:#9b94f2;--p2:#6f67c7;--good:#8dbd4d;--bad:#ff746f;--gold:#f2b24e;--blue:#65a9ef} *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}body{margin:0;min-height:100vh;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;padding:18px}.app{max-width:780px;margin:auto}.head{display:flex;align-items:center;gap:12px}.head h1{font-size:25px;margin:0;flex:1}.iconbtn,.btn,.choice{border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:14px;padding:11px 14px;font-weight:700;cursor:pointer}.iconbtn{padding:9px 12px}.sub{color:var(--muted);margin:4px 0 14px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0}.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:9px;text-align:center}.stat b{display:block;font-size:20px}.stat span{font-size:11px;color:var(--muted)}.status{min-height:45px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:11px 14px;margin:10px 0;font-weight:700}.game{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px;min-height:330px}.row{display:flex;gap:9px;flex-wrap:wrap;align-items:center;justify-content:center}.choice{font-size:18px;min-width:70px}.choice.selected{outline:3px solid var(--gold)}.big{font-size:46px;text-align:center;margin:14px}.panel{border:1px dashed var(--line);border-radius:16px;padding:14px;margin:10px 0}.primary{background:var(--p);color:#fff;border-color:transparent}.good{background:color-mix(in srgb,var(--good) 16%,var(--card))}.bad{background:color-mix(in srgb,var(--bad) 16%,var(--card))}.grid{display:grid;gap:5px;max-width:440px;margin:10px auto}.cell{aspect-ratio:1;border:1px solid var(--line);border-radius:9px;background:var(--card);display:grid;place-items:center;font-size:24px;cursor:pointer;user-select:none}.cell.wall{background:#6d6a63}.cell.start{background:#cdeebc}.cell.goal{background:#ffe4a7}.tiny{font-size:12px;color:var(--muted)}.clock{width:220px;height:220px;border:8px solid var(--p);border-radius:50%;margin:10px auto;position:relative;background:var(--card)}.clock:after{content:'';position:absolute;width:12px;height:12px;background:var(--text);border-radius:50%;left:50%;top:50%;transform:translate(-50%,-50%)}.hand{position:absolute;left:50%;bottom:50%;transform-origin:50% 100%;border-radius:6px}.hour{width:7px;height:58px;background:var(--text)}.minute{width:4px;height:80px;background:var(--blue)}.num{position:absolute;transform:translate(-50%,-50%);font-weight:800}.plan{display:grid;grid-template-columns:repeat(3,1fr);gap:3px;width:180px}.room{aspect-ratio:1;border-radius:7px;border:1px solid var(--line);display:grid;place-items:center;font-size:23px;background:var(--bg)}.plans{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}.planbtn{padding:8px;border-radius:14px;border:2px solid var(--line);background:var(--card);cursor:pointer}.ingredients{display:flex;gap:7px;justify-content:center;flex-wrap:wrap}.order{font-size:30px;letter-spacing:6px;text-align:center}.gear{font-size:30px}.gear.on{animation:spin 1.2s linear infinite;color:var(--good)}@keyframes spin{to{transform:rotate(360deg)}}.footer{display:flex;justify-content:space-between;gap:8px;margin-top:12px;flex-wrap:wrap}.kbd{font-family:monospace;border:1px solid var(--line);padding:2px 6px;border-radius:5px}.shake{animation:shake .25s}@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}@media(max-width:540px){body{padding:10px}.game{padding:11px}.choice{padding:10px;font-size:16px}.head h1{font-size:21px}}
</style>
</head>
<body><div class="app"><div class="head"><div id="emoji" class="big" style="margin:0;font-size:36px">🎮</div><h1 id="title">Jogo</h1><button class="iconbtn" id="theme">🌙</button></div><p class="sub" id="subtitle"></p><div class="stats"><div class="stat"><b id="points">0</b><span>PONTOS</span></div><div class="stat"><b id="level">1</b><span>FASE</span></div><div class="stat"><b id="record">0</b><span>RECORDE</span></div></div><div class="status" id="status">Carregando…</div><main class="game" id="game"></main><div class="footer"><a class="btn" href="../">← Mundo Antônio Jr.</a><button class="btn" id="restart">↻ Reiniciar</button></div></div>
<script>
(()=>{
const $=s=>document.querySelector(s), game=$('#game'), status=$('#status'), pts=$('#points'), lvl=$('#level'), rec=$('#record');
const slug=new URLSearchParams(location.search).get('g')||'mercadinho';
const META={mercadinho:['🛒','Mercadinho Maluco','Compre exatamente o que cabe no orçamento.'],orquestra:['🥁','Orquestra dos Bichos','Escute o ritmo e repita a sequência dos animais.'],maquina:['⚙️','Máquina Maluca','Faça todas as engrenagens girarem ao mesmo tempo.'],labirinto:['🧱','Construtor de Labirintos','Construa um labirinto e depois prove que ele tem saída.'],silabas:['📬','Correio das Sílabas','Complete as palavras colocando a sílaba que está faltando.'],restaurante:['🍕','Restaurante Maluco','Prepare os pedidos seguindo a receita na ordem certa.'],relogio:['⏰','Relógio do Coelho','Acerte os ponteiros para o horário pedido.'],arquiteto:['🏠','Pequeno Arquiteto','Escolha a planta que respeita todas as regras.'],ilha:['🏝️','Ilha dos Tesouros','Encontre a chave e abra o baú escondido na ilha.'],oficina:['🔩','Oficina de Invenções','Monte defletores para levar a bolinha até o balde.']};
const meta=META[slug]||META.mercadinho; $('#emoji').textContent=meta[0];$('#title').textContent=meta[1];$('#subtitle').textContent=meta[2];document.title=meta[1]+' — Jogos do Antônio Jr.';
let points=0,level=1;const rk='ajr-record-'+slug;let record=+(localStorage.getItem(rk)||0);rec.textContent=record;
function setStatus(t,kind=''){status.textContent=t;status.className='status '+kind}function add(n){points+=n;pts.textContent=points;if(points>record){record=points;rec.textContent=record;localStorage.setItem(rk,record)}}function next(){level++;lvl.textContent=level}function rand(a,b){return Math.floor(Math.random()*(b-a+1))+a}function sample(a){return a[Math.floor(Math.random()*a.length)]}function shuffle(a){return [...a].sort(()=>Math.random()-.5)}function beep(freq=500,d=.08){try{const C=window.AudioContext||window.webkitAudioContext,c=beep.c||(beep.c=new C()),o=c.createOscillator(),g=c.createGain();o.frequency.value=freq;g.gain.setValueAtTime(.08,c.currentTime);g.gain.exponentialRampToValueAtTime(.001,c.currentTime+d);o.connect(g).connect(c.destination);o.start();o.stop(c.currentTime+d)}catch{}}
function win(msg='Muito bem!'){add(10+level*2);beep(740,.12);setStatus('⭐ '+msg,'good')}function miss(msg='Tente outra vez.'){beep(180,.12);setStatus('💡 '+msg,'bad');game.classList.add('shake');setTimeout(()=>game.classList.remove('shake'),260)}
function mercadinho(){const products=[['🍎','Maçã'],['🍌','Banana'],['🥛','Leite'],['🍞','Pão'],['🧀','Queijo'],['🥕','Cenoura'],['🍪','Biscoito'],['🧃','Suco']];let chosen=new Set, items=shuffle(products).slice(0,6).map((x,i)=>({...x,price:rand(1,Math.min(9,4+level))}));let answer=shuffle(items).slice(0,Math.min(3,2+Math.floor(level/4)));let target=answer.reduce((s,x)=>s+x.price,0);game.innerHTML=`<div class="panel"><b>Você tem R$ ${target}.</b><div class="tiny">Escolha produtos que somem exatamente esse valor.</div></div><div class="row" id="shop"></div><div class="panel">Total: <b id="total">R$ 0</b></div><div class="row"><button class="btn primary" id="check">Conferir compra</button></div>`;const shop=$('#shop');items.forEach((it,i)=>{let b=document.createElement('button');b.className='choice';b.innerHTML=`${it[0]}<br><span class="tiny">R$ ${it.price}</span>`;b.onclick=()=>{chosen.has(i)?chosen.delete(i):chosen.add(i);b.classList.toggle('selected');$('#total').textContent='R$ '+[...chosen].reduce((s,j)=>s+items[j].price,0)};shop.appendChild(b)});$('#check').onclick=()=>{let t=[...chosen].reduce((s,j)=>s+items[j].price,0);if(t===target){win('Compra certinha!');next();setTimeout(mercadinho,650)}else miss(t<target?`Ainda faltam R$ ${target-t}.`:`Passou R$ ${t-target}.`)};setStatus('Monte uma compra que use todo o orçamento.')}
function orquestra(){const animals=[['🐸',262],['🐱',330],['🐶',392],['🦁',523]];let seq=Array.from({length:Math.min(8,2+level)},()=>rand(0,3)),pos=0,locked=true;game.innerHTML=`<div class="big">🎼</div><div class="row" id="band"></div><div class="row"><button class="btn primary" id="hear">▶ Ouvir sequência</button></div>`;animals.forEach((a,i)=>{let b=document.createElement('button');b.className='choice';b.textContent=a[0];b.onclick=()=>{if(locked)return;beep(a[1],.13);if(i===seq[pos]){pos++;if(pos===seq.length){locked=true;win('Você virou maestro!');next();setTimeout(orquestra,700)}}else{pos=0;miss('Ops! Escute de novo.');locked=true;setTimeout(play,500)}};$('#band').appendChild(b)});async function play(){locked=true;pos=0;setStatus('Escute com atenção…');for(const i of seq){beep(animals[i][1],.2);await new Promise(r=>setTimeout(r,450))}locked=false;setStatus('Agora repita!')}$('#hear').onclick=play;setStatus('Clique em Ouvir sequência.')}
function maquina(){let n=level<4?3:4,size=n*n,state=Array(size).fill(true),solution=Array.from({length:size},()=>Math.random()<.45);if(solution.every(v=>!v))solution[0]=true;function toggle(arr,i){let r=Math.floor(i/n),c=i%n;[[r,c],[r-1,c],[r+1,c],[r,c-1],[r,c+1]].forEach(([y,x])=>{if(y>=0&&y<n&&x>=0&&x<n)arr[y*n+x]=!arr[y*n+x]})}solution.forEach((v,i)=>{if(v)toggle(state,i)});game.innerHTML=`<div class="tiny">Clique numa engrenagem: ela e as vizinhas mudam entre parada e girando.</div><div class="grid" id="gears" style="grid-template-columns:repeat(${n},1fr)"></div>`;function draw(){let g=$('#gears');g.innerHTML='';state.forEach((on,i)=>{let c=document.createElement('button');c.className='cell gear '+(on?'on':'');c.textContent='⚙️';c.onclick=()=>{toggle(state,i);draw();if(state.every(Boolean)){win('Máquina funcionando!');next();setTimeout(maquina,700)}};g.appendChild(c)})}draw();setStatus('Faça TODAS as engrenagens girarem.')}
function labirinto(){const n=7,start=0,goal=n*n-1;let walls=new Set,testing=false,pos=start;game.innerHTML=`<div class="tiny">1) Toque nas casas para criar pelo menos 8 paredes. 2) Clique em Testar e leve o explorador até a bandeira.</div><div class="grid" id="maze" style="grid-template-columns:repeat(${n},1fr)"></div><div class="row"><button class="btn primary" id="test">Testar labirinto</button><button class="btn" data-d="-7">↑</button><button class="btn" data-d="-1">←</button><button class="btn" data-d="1">→</button><button class="btn" data-d="7">↓</button></div>`;function draw(){let m=$('#maze');m.innerHTML='';for(let i=0;i<n*n;i++){let c=document.createElement('div');c.className='cell'+(walls.has(i)?' wall':'')+(i===start?' start':'')+(i===goal?' goal':'');c.textContent=i===pos&&testing?'🧒':i===start?'🚪':i===goal?'🏁':'';c.onclick=()=>{if(!testing&&i!==start&&i!==goal){walls.has(i)?walls.delete(i):walls.add(i);draw()}};m.appendChild(c)}}function reachable(){let q=[start],seen=new Set([start]);while(q.length){let i=q.shift(),r=Math.floor(i/n),c=i%n;for(const [dr,dc] of [[1,0],[-1,0],[0,1],[0,-1]]){let y=r+dr,x=c+dc,j=y*n+x;if(y>=0&&y<n&&x>=0&&x<n&&!walls.has(j)&&!seen.has(j)){seen.add(j);q.push(j)}}}return seen.has(goal)}$('#test').onclick=()=>{if(walls.size<8)return miss('Coloque pelo menos 8 paredes.');if(!reachable())return miss('Esse labirinto ficou sem saída! Abra algum caminho.');testing=true;pos=start;draw();setStatus('Labirinto válido! Agora atravesse.')};document.querySelectorAll('[data-d]').forEach(b=>b.onclick=()=>{if(!testing)return;let d=+b.dataset.d,r=Math.floor(pos/n),c=pos%n,nx=pos+d;if((d===-1&&c===0)||(d===1&&c===n-1)||nx<0||nx>=n*n||walls.has(nx))return;pos=nx;draw();if(pos===goal){win('Você construiu e resolveu!');next();setTimeout(labirinto,800)}});draw();setStatus('Construa um labirinto que ainda tenha solução.')}
function silabas(){const words=[['🐱','GA','TO'],['🐸','SA','PO'],['🏠','CA','SA'],['🍌','BA','NA','NA'],['⚽','BO','LA'],['🐭','RA','TO'],['🦆','PA','TO'],['🌽','MI','LHO'],['🐴','CA','VA','LO'],['🍍','A','BA','CA','XI']];let w=sample(words),parts=w.slice(1),k=rand(0,parts.length-1),ans=parts[k],opts=shuffle([ans,...shuffle(['PA','TO','CA','BO','LA','MI','SA','RA','NA','VA','LO','XI']).filter(x=>x!==ans).slice(0,3)]);game.innerHTML=`<div class="big">${w[0]}</div><div class="order">${parts.map((p,i)=>i===k?'__':p).join(' · ')}</div><div class="row" id="syll"></div>`;opts.forEach(o=>{let b=document.createElement('button');b.className='choice';b.textContent=o;b.onclick=()=>{if(o===ans){win('Carta entregue!');next();setTimeout(silabas,600)}else miss('Essa sílaba não completa a palavra.')};$('#syll').appendChild(b)});setStatus('Qual sílaba está faltando?')}
function restaurante(){const recipes=[['🍕',['🍞','🍅','🧀']],['🥪',['🍞','🥬','🧀','🍞']],['🍔',['🍞','🥩','🧀','🥬','🍞']],['🥗',['🥬','🍅','🥕']],['🌮',['🌮','🥩','🥬','🧀']]],all=['🍞','🍅','🧀','🥬','🥩','🥕','🌮'];let r=sample(recipes),need=r[1].slice(0,Math.min(r[1].length,2+Math.ceil(level/2))),made=[];game.innerHTML=`<div class="big">${r[0]}</div><div class="panel">Pedido: <div class="order">${need.join(' ')}</div></div><div class="panel">Sua bancada: <div class="order" id="made">—</div></div><div class="ingredients" id="ings"></div>`;shuffle(all).forEach(x=>{let b=document.createElement('button');b.className='choice';b.textContent=x;b.onclick=()=>{let i=made.length;if(x===need[i]){made.push(x);$('#made').textContent=made.join(' ');beep(500+i*70);if(made.length===need.length){win('Pedido perfeito!');next();setTimeout(restaurante,650)}}else{made=[];$('#made').textContent='—';miss('Ingrediente fora da ordem. Recomece o prato.')}};$('#ings').appendChild(b)});setStatus('Monte o pedido na ordem mostrada.')}
function relogio(){let targetH=rand(1,12),step=level<4?15:5,targetM=rand(0,(60/step)-1)*step,h=12,m=0;game.innerHTML=`<div class="panel">O coelho precisa chegar às <b>${String(targetH).padStart(2,'0')}:${String(targetM).padStart(2,'0')}</b>.</div><div class="clock" id="clock"><div class="hand hour" id="hh"></div><div class="hand minute" id="mm"></div></div><div class="row"><button class="btn" id="hp">Hora +</button><button class="btn" id="mp">+ ${step} min</button><button class="btn primary" id="ok">Conferir</button></div>`;[['12',50,8],['3',92,50],['6',50,92],['9',8,50]].forEach(([t,x,y])=>{let e=document.createElement('span');e.className='num';e.textContent=t;e.style.left=x+'%';e.style.top=y+'%';$('#clock').appendChild(e)});function draw(){let ha=(h%12)*30+m*.5,ma=m*6;$('#hh').style.transform=`translateX(-50%) rotate(${ha}deg)`;$('#mm').style.transform=`translateX(-50%) rotate(${ma}deg)`}$('#hp').onclick=()=>{h=h%12+1;draw()};$('#mp').onclick=()=>{m=(m+step)%60;if(m===0)h=h%12+1;draw()};$('#ok').onclick=()=>{if(h===targetH&&m===targetM){win('Chegou na hora certa!');next();setTimeout(relogio,650)}else miss('Olhe os ponteiros e tente de novo.')};draw();setStatus('Ajuste o relógio para o horário pedido.')}
function arquiteto(){const R=['🛏️','🍳','🛋️','🚿','🌳','📚','🎮','🍽️','🚪'];let correct=shuffle(R),corner=correct[0],pair=[correct[1],correct[2]],wrong1=correct.slice(),wrong2=correct.slice();[wrong1[0],wrong1[4]]=[wrong1[4],wrong1[0]];[wrong2[2],wrong2[8]]=[wrong2[8],wrong2[2]];function adj(a,b,p){let ia=p.indexOf(a),ib=p.indexOf(b),ra=Math.floor(ia/3),ca=ia%3,rb=Math.floor(ib/3),cb=ib%3;return Math.abs(ra-rb)+Math.abs(ca-cb)===1}let plans=shuffle([correct,wrong1,wrong2]);game.innerHTML=`<div class="panel"><b>Regras:</b><br>• ${pair[0]} deve ficar ao lado de ${pair[1]}<br>• ${corner} deve ficar em um canto.</div><div class="plans" id="plans"></div>`;plans.forEach((plan,i)=>{let b=document.createElement('button');b.className='planbtn';b.innerHTML=`<div class="tiny">PLANTA ${i+1}</div><div class="plan">${plan.map(x=>`<div class="room">${x}</div>`).join('')}</div>`;b.onclick=()=>{let cornerOk=[0,2,6,8].includes(plan.indexOf(corner)),ok=adj(pair[0],pair[1],plan)&&cornerOk;if(ok){win('Projeto aprovado!');next();setTimeout(arquiteto,700)}else miss('Essa planta quebra uma das regras.')};$('#plans').appendChild(b)});setStatus('Qual planta respeita todas as regras?')}
function ilha(){const n=6,start=0;let key=rand(7,20),treasure=rand(22,35);while(treasure===key)treasure=rand(22,35);let pos=start,got=false,walls=new Set;for(let i=0;i<7+level;i++){let x=rand(1,n*n-2);if(x!==key&&x!==treasure)walls.add(x)}function reachable(goal,extraWalls=walls){let q=[start],seen=new Set([start]);while(q.length){let i=q.shift(),r=Math.floor(i/n),c=i%n;if(i===goal)return true;for(const [dr,dc] of [[1,0],[-1,0],[0,1],[0,-1]]){let y=r+dr,x=c+dc,j=y*n+x;if(y>=0&&y<n&&x>=0&&x<n&&!extraWalls.has(j)&&!seen.has(j)){seen.add(j);q.push(j)}}}return false}if(!reachable(key)||!reachable(treasure))walls.clear();game.innerHTML=`<div class="grid" id="island" style="grid-template-columns:repeat(${n},1fr)"></div><div class="row"><button class="btn" data-m="-6">↑</button><button class="btn" data-m="-1">←</button><button class="btn" data-m="1">→</button><button class="btn" data-m="6">↓</button></div>`;function draw(){let g=$('#island');g.innerHTML='';for(let i=0;i<n*n;i++){let c=document.createElement('div');c.className='cell';c.textContent=i===pos?'🧒':walls.has(i)?'🪨':i===key&&!got?'🗝️':i===treasure?'🧰':'🌿';g.appendChild(c)}}document.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>{let d=+b.dataset.m,r=Math.floor(pos/n),c=pos%n,nx=pos+d;if((d===-1&&c===0)||(d===1&&c===n-1)||nx<0||nx>=n*n||walls.has(nx))return;pos=nx;if(pos===key&&!got){got=true;add(5);setStatus('🗝️ Chave encontrada! Agora procure o baú.','good')}if(pos===treasure){if(!got)return setStatus('🔒 O baú está trancado. Ache a chave primeiro!');win('Tesouro encontrado!');next();return setTimeout(ilha,800)}draw()});draw();setStatus('Ache a chave 🗝️ e depois o tesouro 🧰.')}
function oficina(){const rows=Math.min(6,3+level),cols=5,start=2;let desired=[start],cur=start;for(let r=0;r<rows;r++){let options=[-1,0,1].filter(d=>cur+d>=0&&cur+d<cols),d=sample(options);cur+=d;desired.push(cur)}let bucket=desired[rows],choices=Array(rows).fill(0);game.innerHTML=`<div class="tiny">Cada linha pode empurrar a bolinha ↙️, ⬇️ ou ↘️. Monte o caminho até o balde.</div><div class="panel"><div class="order">⚪ começa na coluna ${start+1} → 🪣 está na coluna ${bucket+1}</div></div><div id="devices"></div><div class="row"><button class="btn primary" id="simulate">▶ Testar invenção</button></div>`;function draw(){let d=$('#devices');d.innerHTML='';choices.forEach((v,i)=>{let row=document.createElement('div');row.className='row';row.innerHTML=`<span class="tiny">Etapa ${i+1}</span>`;[-1,0,1].forEach(x=>{let b=document.createElement('button');b.className='choice '+(v===x?'selected':'');b.textContent=x<0?'↙️':x>0?'↘️':'⬇️';b.onclick=()=>{choices[i]=x;draw()};row.appendChild(b)});d.appendChild(row)})}$('#simulate').onclick=()=>{let c=start,valid=true;for(const d of choices){c+=d;if(c<0||c>=cols){valid=false;break}}if(valid&&c===bucket){win('A invenção funcionou!');next();setTimeout(oficina,700)}else miss(valid?`A bolinha terminou na coluna ${c+1}.`:'A bolinha saiu da bancada!')};draw();setStatus('Planeje o caminho antes de testar.')}
const starters={mercadinho,orquestra,maquina,labirinto,silabas,restaurante,relogio,arquiteto,ilha,oficina};function start(){points=0;level=1;pts.textContent=0;lvl.textContent=1;starters[slug]?starters[slug]():mercadinho()}$('#restart').onclick=start;
const theme=$('#theme');function setTheme(t){document.documentElement.dataset.theme=t;theme.textContent=t==='dark'?'☀️':'🌙';localStorage.setItem('ajr-theme',t)}setTheme(localStorage.getItem('ajr-theme')||(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light'));theme.onclick=()=>setTheme(document.documentElement.dataset.theme==='dark'?'light':'dark');
start();
})();
</script></body></html>
