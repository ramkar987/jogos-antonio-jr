<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Cara a Cara</title>
<style>
  :root {
    --bg: #FFF8EC;
    --card-bg: #ffffff;
    --card-shadow: rgba(0,0,0,0.08);
    --title: #3C3489;
    --text-secondary: #888780;
    --text-primary: #2C2C2A;
    --btn-bg: #3C3489;
    --btn-bg-active: #26215C;
    --btn-text: #ffffff;
    --key-bg: #FAF8F2;
    --key-border: #E1DDCF;
    --key-text: #2C2C2A;
    --face-tile-bg: #FAF8F2;
    --face-tile-border: #E1DDCF;
    --face-out-overlay: rgba(30, 28, 24, 0.55);
    --secret-border: #EF9F27;
    --yes-btn: #639922;
    --no-btn: #E24B4A;
  }
  [data-theme="dark"] {
    --bg: #1C1B18;
    --card-bg: #26251F;
    --card-shadow: rgba(0,0,0,0.4);
    --title: #B4ACF2;
    --text-secondary: #A6A399;
    --text-primary: #F2F0E8;
    --btn-bg: #7F77DD;
    --btn-bg-active: #534AB7;
    --btn-text: #1C1B18;
    --key-bg: #322F28;
    --key-border: #47443B;
    --key-text: #F2F0E8;
    --face-tile-bg: #322F28;
    --face-tile-border: #47443B;
    --face-out-overlay: rgba(10, 9, 8, 0.72);
    --secret-border: #F0B24A;
    --yes-btn: #7BAF3A;
    --no-btn: #F09595;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0;
    padding: 0;
    min-height: 100%;
    background: var(--bg);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    transition: background .2s;
  }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 20px;
  }
  .card {
    position: relative;
    width: 100%;
    max-width: 520px;
    background: var(--card-bg);
    border-radius: 24px;
    box-shadow: 0 8px 30px var(--card-shadow);
    padding: 22px 20px 26px;
    text-align: center;
    transition: background .2s;
  }
  .theme-toggle {
    position: absolute;
    top: 16px;
    right: 16px;
    width: 38px;
    height: 38px;
    border-radius: 50%;
    border: 2px solid var(--key-border);
    background: var(--key-bg);
    color: var(--key-text);
    font-size: 18px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    touch-action: manipulation;
  }
  h1 {
    font-size: 22px;
    margin: 0 0 4px;
    color: var(--title);
  }
  .subtitle {
    font-size: 13px;
    color: var(--text-secondary);
    margin: 0 0 14px;
  }

  .status {
    font-size: 15px;
    font-weight: 600;
    color: var(--text-primary);
    min-height: 44px;
    margin-bottom: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .faces-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 8px;
    margin-bottom: 18px;
  }
  .face-tile {
    position: relative;
    aspect-ratio: 3 / 4;
    background: var(--face-tile-bg);
    border: 2px solid var(--face-tile-border);
    border-radius: 10px;
    overflow: hidden;
  }
  .face-tile svg { width: 100%; height: 100%; display: block; }
  .face-tile.out::after {
    content: "✕";
    position: absolute;
    inset: 0;
    background: var(--face-out-overlay);
    color: #fff;
    font-size: 22px;
    font-weight: 700;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .face-tile.revealed-secret {
    border-color: var(--secret-border);
    border-width: 3px;
  }

  .questions {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 8px;
    margin-bottom: 8px;
  }
  .q-btn {
    padding: 10px 6px;
    font-size: 13px;
    font-weight: 600;
    border-radius: 10px;
    border: 2px solid var(--key-border);
    background: var(--key-bg);
    color: var(--key-text);
    cursor: pointer;
    transition: opacity .15s, transform .1s;
    touch-action: manipulation;
  }
  .q-btn:active { transform: scale(0.96); }
  .q-btn:disabled { opacity: 0.35; cursor: default; }

  .answer-row {
    display: none;
    justify-content: center;
    gap: 12px;
    margin: 10px 0 4px;
  }
  .answer-row.active { display: flex; }
  .answer-btn {
    flex: 1;
    max-width: 140px;
    padding: 12px;
    font-size: 15px;
    font-weight: 700;
    border-radius: 12px;
    border: none;
    color: #fff;
    cursor: pointer;
    touch-action: manipulation;
  }
  .answer-btn.yes { background: var(--yes-btn); }
  .answer-btn.no { background: var(--no-btn); }
  .answer-btn:active { transform: scale(0.96); }

  .guess-row {
    margin-top: 10px;
  }
  .guess-select {
    width: 100%;
    padding: 12px;
    font-size: 15px;
    border-radius: 12px;
    border: 2px solid var(--key-border);
    background: var(--key-bg);
    color: var(--key-text);
    margin-bottom: 10px;
  }

  .start-btn {
    width: 100%;
    padding: 15px;
    font-size: 17px;
    font-weight: 700;
    border-radius: 16px;
    border: none;
    background: var(--btn-bg);
    color: var(--btn-text);
    cursor: pointer;
    transition: background .15s, transform .1s;
    touch-action: manipulation;
    margin-top: 6px;
  }
  .start-btn:active { transform: scale(0.97); background: var(--btn-bg-active); }

  .hidden { display: none !important; }
</style>
</head>
<body>

<div class="card">
  <button class="theme-toggle" id="theme-toggle" aria-label="Alternar modo escuro">🌙</button>
  <h1>Cara a Cara</h1>
  <p class="subtitle">Faça perguntas para descobrir o rosto secreto</p>

  <div class="status" id="status">Toque em iniciar</div>

  <div class="faces-grid" id="faces-grid"></div>

  <div id="game-controls">
    <div class="questions" id="questions"></div>

    <div class="answer-row" id="answer-row">
      <button class="answer-btn yes" id="answer-yes">Sim ✔️</button>
      <button class="answer-btn no" id="answer-no">Não ✖️</button>
    </div>

    <div class="guess-row hidden" id="guess-row">
      <select class="guess-select" id="guess-select">
        <option value="">Escolha quem você acha que é...</option>
      </select>
      <button class="start-btn" id="guess-btn">É esse aqui!</button>
    </div>
  </div>

  <button class="start-btn" id="start">Iniciar jogo</button>
</div>

<script>
(function(){
  // Modo escuro
  const themeToggle = document.getElementById('theme-toggle');
  function applyTheme(theme){
    document.documentElement.setAttribute('data-theme', theme);
    themeToggle.textContent = theme === 'dark' ? '☀️' : '🌙';
    try { localStorage.setItem('caraacara-theme', theme); } catch(e) {}
  }
  let savedTheme = '';
  try { savedTheme = localStorage.getItem('caraacara-theme') || ''; } catch(e) {}
  if (savedTheme === 'dark' || (!savedTheme && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches)){
    applyTheme('dark');
  } else {
    applyTheme(savedTheme === 'dark' ? 'dark' : 'light');
  }
  themeToggle.addEventListener('click', () => {
    const current = document.documentElement.getAttribute('data-theme');
    applyTheme(current === 'dark' ? 'light' : 'dark');
  });

  const SKIN_TONES = ['#F4C29B', '#E8A87C', '#C68863', '#8D5A3C'];
  const HAIR_COLORS = ['#3B2A1E', '#7A4A24', '#D6B370', '#1C1C1C', '#B0432E'];

  function faceSVG(attrs){
    const skin = attrs.skin;
    const hair = attrs.hairColor;
    const parts = [];

    // rosto
    parts.push('<ellipse cx="50" cy="58" rx="30" ry="34" fill="' + skin + '"/>');

    // orelhas
    parts.push('<circle cx="20" cy="58" r="7" fill="' + skin + '"/>');
    parts.push('<circle cx="80" cy="58" r="7" fill="' + skin + '"/>');

    // cabelo
    if (attrs.hair === 'careca'){
      // sem cabelo
    } else if (attrs.hair === 'curto'){
      parts.push('<path d="M20 45 Q50 10 80 45 L80 30 Q50 15 20 30 Z" fill="' + hair + '"/>');
    } else if (attrs.hair === 'longo'){
      parts.push('<path d="M18 45 Q50 8 82 45 L86 95 L74 95 L74 50 Q50 25 26 50 L26 95 L14 95 Z" fill="' + hair + '"/>');
    } else if (attrs.hair === 'moicano'){
      parts.push('<path d="M42 10 L58 10 L54 40 L46 40 Z" fill="' + hair + '"/>');
    }

    // chapéu
    if (attrs.hat){
      parts.push('<rect x="22" y="18" width="56" height="8" rx="2" fill="#3C3489"/>');
      parts.push('<rect x="32" y="2" width="36" height="20" rx="4" fill="#3C3489"/>');
    }

    // óculos
    if (attrs.glasses){
      parts.push('<circle cx="38" cy="55" r="9" fill="none" stroke="#2C2C2A" stroke-width="3"/>');
      parts.push('<circle cx="62" cy="55" r="9" fill="none" stroke="#2C2C2A" stroke-width="3"/>');
      parts.push('<line x1="47" y1="55" x2="53" y2="55" stroke="#2C2C2A" stroke-width="3"/>');
    }

    // olhos
    parts.push('<circle cx="38" cy="55" r="3.2" fill="#2C2C2A"/>');
    parts.push('<circle cx="62" cy="55" r="3.2" fill="#2C2C2A"/>');

    // sobrancelhas
    if (attrs.eyebrows === 'grossas'){
      parts.push('<rect x="31" y="45" width="14" height="4" rx="2" fill="' + hair + '"/>');
      parts.push('<rect x="55" y="45" width="14" height="4" rx="2" fill="' + hair + '"/>');
    }

    // nariz
    parts.push('<path d="M50 58 L46 72 Q50 76 54 72 Z" fill="rgba(0,0,0,0.12)"/>');

    // bigode
    if (attrs.mustache){
      parts.push('<path d="M38 75 Q50 82 62 75 Q50 80 38 75" fill="' + hair + '"/>');
    }

    // boca
    if (attrs.smile){
      parts.push('<path d="M38 82 Q50 92 62 82" stroke="#A83232" stroke-width="3" fill="none" stroke-linecap="round"/>');
    } else {
      parts.push('<line x1="40" y1="85" x2="60" y2="85" stroke="#A83232" stroke-width="3" stroke-linecap="round"/>');
    }

    // sardas
    if (attrs.freckles){
      [[32,68],[36,72],[64,72],[68,68]].forEach(([x,y]) => {
        parts.push('<circle cx="' + x + '" cy="' + y + '" r="1.4" fill="rgba(0,0,0,0.25)"/>');
      });
    }

    // brinco
    if (attrs.earring){
      parts.push('<circle cx="80" cy="66" r="2.2" fill="#EF9F27"/>');
    }

    return '<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">' + parts.join('') + '</svg>';
  }

  // 12 personagens com combinações variadas e nomes simples
  const CHARACTERS = [
    { name: 'Ana',    skin: SKIN_TONES[0], hairColor: HAIR_COLORS[0], hair: 'longo',  hat: false, glasses: false, mustache: false, smile: true,  eyebrows: 'finas',   freckles: true,  earring: true  },
    { name: 'Bruno',  skin: SKIN_TONES[1], hairColor: HAIR_COLORS[1], hair: 'curto',  hat: false, glasses: true,  mustache: false, smile: true,  eyebrows: 'grossas',  freckles: false, earring: false },
    { name: 'Clara',  skin: SKIN_TONES[2], hairColor: HAIR_COLORS[2], hair: 'longo',  hat: true,  glasses: false, mustache: false, smile: false, eyebrows: 'finas',   freckles: false, earring: false },
    { name: 'Davi',   skin: SKIN_TONES[3], hairColor: HAIR_COLORS[3], hair: 'careca', hat: false, glasses: false, mustache: true,  smile: true,  eyebrows: 'grossas',  freckles: false, earring: false },
    { name: 'Elisa',  skin: SKIN_TONES[0], hairColor: HAIR_COLORS[4], hair: 'curto',  hat: false, glasses: true,  mustache: false, smile: false, eyebrows: 'finas',   freckles: true,  earring: true  },
    { name: 'Felipe', skin: SKIN_TONES[1], hairColor: HAIR_COLORS[0], hair: 'moicano',hat: false, glasses: false, mustache: false, smile: true,  eyebrows: 'grossas',  freckles: false, earring: false },
    { name: 'Gabi',   skin: SKIN_TONES[2], hairColor: HAIR_COLORS[1], hair: 'longo',  hat: false, glasses: false, mustache: false, smile: true,  eyebrows: 'finas',   freckles: false, earring: true  },
    { name: 'Hugo',   skin: SKIN_TONES[3], hairColor: HAIR_COLORS[2], hair: 'curto',  hat: true,  glasses: false, mustache: true,  smile: false, eyebrows: 'grossas',  freckles: false, earring: false },
    { name: 'Iris',   skin: SKIN_TONES[0], hairColor: HAIR_COLORS[3], hair: 'careca', hat: false, glasses: true,  mustache: false, smile: true,  eyebrows: 'finas',   freckles: true,  earring: false },
    { name: 'Joao',   skin: SKIN_TONES[1], hairColor: HAIR_COLORS[4], hair: 'curto',  hat: false, glasses: false, mustache: false, smile: false, eyebrows: 'grossas',  freckles: false, earring: false },
    { name: 'Kate',   skin: SKIN_TONES[2], hairColor: HAIR_COLORS[0], hair: 'longo',  hat: true,  glasses: true,  mustache: false, smile: true,  eyebrows: 'finas',   freckles: false, earring: true  },
    { name: 'Leo',    skin: SKIN_TONES[3], hairColor: HAIR_COLORS[1], hair: 'moicano',hat: false, glasses: false, mustache: true,  smile: true,  eyebrows: 'grossas',  freckles: true,  earring: false }
  ];

  const QUESTIONS = [
    { label: '🎩 Usa chapéu?', key: 'hat', type: 'bool' },
    { label: '👓 Usa óculos?', key: 'glasses', type: 'bool' },
    { label: '👨 Tem bigode?', key: 'mustache', type: 'bool' },
    { label: '😀 Está sorrindo?', key: 'smile', type: 'bool' },
    { label: '🧑‍🦲 É careca?', key: 'hair', type: 'eq', value: 'careca' },
    { label: '💇 Tem cabelo longo?', key: 'hair', type: 'eq', value: 'longo' },
    { label: '🦋 Tem sardas?', key: 'freckles', type: 'bool' },
    { label: '💎 Usa brinco?', key: 'earring', type: 'bool' },
    { label: '🤨 Sobrancelha grossa?', key: 'eyebrows', type: 'eq', value: 'grossas' }
  ];

  const gridEl = document.getElementById('faces-grid');
  const statusEl = document.getElementById('status');
  const startBtn = document.getElementById('start');
  const questionsEl = document.getElementById('questions');
  const answerRow = document.getElementById('answer-row');
  const answerYesBtn = document.getElementById('answer-yes');
  const answerNoBtn = document.getElementById('answer-no');
  const guessRow = document.getElementById('guess-row');
  const guessSelect = document.getElementById('guess-select');
  const guessBtn = document.getElementById('guess-btn');

  let secretIndex = -1;
  let eliminated = [];
  let usedQuestions = [];
  let pendingQuestion = null;
  let gameActive = false;

  function matchesAttr(char, q){
    if (q.type === 'bool') return !!char[q.key];
    return char[q.key] === q.value;
  }

  function renderFaces(revealSecret){
    gridEl.innerHTML = '';
    CHARACTERS.forEach((char, i) => {
      const tile = document.createElement('div');
      tile.className = 'face-tile' + (eliminated[i] ? ' out' : '') + (revealSecret && i === secretIndex ? ' revealed-secret' : '');
      tile.innerHTML = faceSVG(char);
      gridEl.appendChild(tile);
    });
  }

  function renderQuestions(){
    questionsEl.innerHTML = '';
    QUESTIONS.forEach((q, i) => {
      const btn = document.createElement('button');
      btn.className = 'q-btn';
      btn.textContent = q.label;
      btn.disabled = usedQuestions.includes(i) || !gameActive;
      btn.addEventListener('click', () => askQuestion(q, i));
      questionsEl.appendChild(btn);
    });
  }

  function remainingCount(){
    return eliminated.filter(e => !e).length;
  }

  function askQuestion(q, qIndex){
    if (!gameActive) return;
    pendingQuestion = { q, qIndex };
    answerRow.classList.add('active');
    statusEl.textContent = q.label;
    // desabilita perguntas enquanto espera resposta
    Array.from(questionsEl.children).forEach(b => b.disabled = true);
  }

  function applyAnswer(userSaysYes){
    if (!pendingQuestion) return;
    const { q, qIndex } = pendingQuestion;
    const secretMatches = matchesAttr(CHARACTERS[secretIndex], q);

    // valida se a resposta do usuário bate com o segredo (o jogo responde honestamente)
    // eliminamos rostos cuja característica não bate com a resposta dada
    CHARACTERS.forEach((char, i) => {
      if (eliminated[i]) return;
      const charMatches = matchesAttr(char, q);
      if (charMatches !== secretMatches){
        eliminated[i] = true;
      }
    });

    usedQuestions.push(qIndex);
    pendingQuestion = null;
    answerRow.classList.remove('active');

    renderFaces(false);
    renderQuestions();

    const left = remainingCount();
    if (left <= 1){
      statusEl.textContent = 'Só sobrou um rosto! Escolha quem é o segredo.';
      showGuessOptions();
    } else {
      statusEl.textContent = 'Restam ' + left + ' rostos. Continue perguntando!';
    }
  }

  function showGuessOptions(){
    guessSelect.innerHTML = '<option value="">Escolha quem você acha que é...</option>';
    CHARACTERS.forEach((char, i) => {
      if (!eliminated[i]){
        const opt = document.createElement('option');
        opt.value = i;
        opt.textContent = char.name;
        guessSelect.appendChild(opt);
      }
    });
    guessRow.classList.remove('hidden');
  }

  answerYesBtn.addEventListener('click', () => applyAnswer(true));
  answerNoBtn.addEventListener('click', () => applyAnswer(false));

  guessBtn.addEventListener('click', () => {
    const val = guessSelect.value;
    if (val === '') return;
    const guessed = parseInt(val, 10);
    gameActive = false;
    renderFaces(true);
    renderQuestions();
    guessRow.classList.add('hidden');
    if (guessed === secretIndex){
      statusEl.textContent = 'Parabéns! Você acertou — era ' + CHARACTERS[secretIndex].name + '!';
    } else {
      statusEl.textContent = 'Quase! Era ' + CHARACTERS[secretIndex].name + '. Tente de novo!';
    }
    startBtn.textContent = 'Jogar de novo';
  });

  function randInt(min, max){ return Math.floor(Math.random() * (max - min + 1)) + min; }

  function startGame(){
    secretIndex = randInt(0, CHARACTERS.length - 1);
    eliminated = CHARACTERS.map(() => false);
    usedQuestions = [];
    pendingQuestion = null;
    gameActive = true;

    answerRow.classList.remove('active');
    guessRow.classList.add('hidden');
    statusEl.textContent = 'Pensei em um rosto secreto! Faça perguntas para descobrir';
    startBtn.textContent = 'Reiniciar jogo';

    renderFaces(false);
    renderQuestions();
  }

  startBtn.addEventListener('click', startGame);

  // desenho inicial estático
  eliminated = CHARACTERS.map(() => false);
  renderFaces(false);
  renderQuestions();
})();
</script>

</body>
</html>
