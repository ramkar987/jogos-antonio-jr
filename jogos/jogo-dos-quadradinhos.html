<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Jogo dos Quadradinhos</title>
<style>
  :root {
    --bg: #FFF8EC;
    --card-bg: #ffffff;
    --card-shadow: rgba(0,0,0,0.08);
    --title: #3C3489;
    --text-secondary: #888780;
    --text-primary: #2C2C2A;
    --btn-bg: #3C3489;
    --btn-bg-active: #26215C;
    --btn-text: #ffffff;
    --key-bg: #FAF8F2;
    --key-border: #E1DDCF;
    --key-text: #2C2C2A;
    --dot-color: #5F5E5A;
    --line-empty: #E1DDCF;
    --line-empty-hover: #C7C2B0;
    --you: #378ADD;
    --cpu: #E24B4A;
  }
  [data-theme="dark"] {
    --bg: #1C1B18;
    --card-bg: #26251F;
    --card-shadow: rgba(0,0,0,0.4);
    --title: #B4ACF2;
    --text-secondary: #A6A399;
    --text-primary: #F2F0E8;
    --btn-bg: #7F77DD;
    --btn-bg-active: #534AB7;
    --btn-text: #1C1B18;
    --key-bg: #322F28;
    --key-border: #47443B;
    --key-text: #F2F0E8;
    --dot-color: #D3D1C7;
    --line-empty: #47443B;
    --line-empty-hover: #5C5849;
    --you: #5AA1E8;
    --cpu: #F09595;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0;
    padding: 0;
    min-height: 100%;
    background: var(--bg);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    transition: background .2s;
  }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 20px;
  }
  .card {
    position: relative;
    width: 100%;
    max-width: 420px;
    background: var(--card-bg);
    border-radius: 24px;
    box-shadow: 0 8px 30px var(--card-shadow);
    padding: 22px 20px 26px;
    text-align: center;
    transition: background .2s;
  }
  .theme-toggle {
    position: absolute;
    top: 16px;
    right: 16px;
    width: 38px;
    height: 38px;
    border-radius: 50%;
    border: 2px solid var(--key-border);
    background: var(--key-bg);
    color: var(--key-text);
    font-size: 18px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    touch-action: manipulation;
  }
  h1 {
    font-size: 22px;
    margin: 0 0 4px;
    color: var(--title);
  }
  .subtitle {
    font-size: 13px;
    color: var(--text-secondary);
    margin: 0 0 14px;
  }

  .scoreboard {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 10px;
    font-size: 15px;
    font-weight: 700;
  }
  .score-you { color: var(--you); }
  .score-cpu { color: var(--cpu); }

  .status {
    font-size: 15px;
    font-weight: 600;
    color: var(--text-primary);
    min-height: 22px;
    margin-bottom: 14px;
  }

  .board-wrap {
    width: 100%;
    max-width: 320px;
    margin: 0 auto 18px;
  }
  .grid {
    position: relative;
    width: 100%;
    aspect-ratio: 1 / 1;
  }

  .dot {
    position: absolute;
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: var(--dot-color);
    transform: translate(-50%, -50%);
    z-index: 3;
  }

  .box-fill {
    position: absolute;
    border-radius: 4px;
    opacity: 0;
    transition: opacity .25s;
    z-index: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 14px;
    font-weight: 700;
  }
  .box-fill.filled { opacity: 0.22; }
  .box-fill.you { background: var(--you); color: var(--you); }
  .box-fill.cpu { background: var(--cpu); color: var(--cpu); }

  .line {
    position: absolute;
    background: var(--line-empty);
    border-radius: 3px;
    cursor: pointer;
    z-index: 2;
    transition: background .15s;
  }
  .line.h { height: 6px; }
  .line.v { width: 6px; }
  .line.claimed.you { background: var(--you); cursor: default; }
  .line.claimed.cpu { background: var(--cpu); cursor: default; }
  .line:not(.claimed):hover { background: var(--line-empty-hover); }

  .start-btn {
    width: 100%;
    padding: 15px;
    font-size: 17px;
    font-weight: 700;
    border-radius: 16px;
    border: none;
    background: var(--btn-bg);
    color: var(--btn-text);
    cursor: pointer;
    transition: background .15s, transform .1s;
    touch-action: manipulation;
  }
  .start-btn:active { transform: scale(0.97); background: var(--btn-bg-active); }
</style>
</head>
<body>

<div class="card">
  <button class="theme-toggle" id="theme-toggle" aria-label="Alternar modo escuro">🌙</button>
  <h1>Jogo dos Quadradinhos</h1>
  <p class="subtitle">Toque numa linha para desenhá-la e feche quadrados</p>

  <div class="scoreboard">
    <span class="score-you" id="score-you">Você: 0</span>
    <span class="score-cpu" id="score-cpu">Computador: 0</span>
  </div>

  <div class="status" id="status">Toque em iniciar</div>

  <div class="board-wrap">
    <div class="grid" id="grid"></div>
  </div>

  <button class="start-btn" id="start">Iniciar jogo</button>
</div>

<script>
(function(){
  // Modo escuro
  const themeToggle = document.getElementById('theme-toggle');
  function applyTheme(theme){
    document.documentElement.setAttribute('data-theme', theme);
    themeToggle.textContent = theme === 'dark' ? '☀️' : '🌙';
    try { localStorage.setItem('quadradinhos-theme', theme); } catch(e) {}
  }
  let savedTheme = '';
  try { savedTheme = localStorage.getItem('quadradinhos-theme') || ''; } catch(e) {}
  if (savedTheme === 'dark' || (!savedTheme && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches)){
    applyTheme('dark');
  } else {
    applyTheme(savedTheme === 'dark' ? 'dark' : 'light');
  }
  themeToggle.addEventListener('click', () => {
    const current = document.documentElement.getAttribute('data-theme');
    applyTheme(current === 'dark' ? 'light' : 'dark');
  });

  const gridEl = document.getElementById('grid');
  const statusEl = document.getElementById('status');
  const startBtn = document.getElementById('start');
  const scoreYouEl = document.getElementById('score-you');
  const scoreCpuEl = document.getElementById('score-cpu');

  const DOTS = 4; // 4x4 pontos = 3x3 quadrados
  const BOXES = DOTS - 1;
  const CELL = 100 / BOXES; // percentual por célula

  // hLines[r][c]: linha horizontal entre ponto (r,c) e (r,c+1) -- r: 0..DOTS-1, c: 0..DOTS-2
  // vLines[r][c]: linha vertical entre ponto (r,c) e (r+1,c) -- r: 0..DOTS-2, c: 0..DOTS-1
  // boxes[r][c]: dono da caixa (r,c) -- r,c: 0..BOXES-1
  let hLines, vLines, boxes;
  let scores = { you: 0, cpu: 0 };
  let currentTurn = 'you';
  let gameActive = false;
  let busy = false;

  function setupState(){
    hLines = Array.from({length: DOTS}, () => Array(DOTS - 1).fill(null));
    vLines = Array.from({length: DOTS - 1}, () => Array(DOTS).fill(null));
    boxes = Array.from({length: BOXES}, () => Array(BOXES).fill(null));
    scores = { you: 0, cpu: 0 };
  }

  function boxCompleters(r, c){
    // retorna as 4 linhas que formam a caixa (r,c)
    return [
      { type: 'h', r: r,     c: c },
      { type: 'h', r: r + 1, c: c },
      { type: 'v', r: r,     c: c },
      { type: 'v', r: r,     c: c + 1 }
    ];
  }

  function isLineSet(line){
    return line.type === 'h' ? !!hLines[line.r][line.c] : !!vLines[line.r][line.c];
  }

  function setLine(line, owner){
    if (line.type === 'h') hLines[line.r][line.c] = owner;
    else vLines[line.r][line.c] = owner;
  }

  function boxesAffectedByLine(line){
    // retorna coordenadas de caixa(s) adjacentes a essa linha
    const result = [];
    if (line.type === 'h'){
      if (line.r - 1 >= 0) result.push({ r: line.r - 1, c: line.c });
      if (line.r < BOXES) result.push({ r: line.r, c: line.c });
    } else {
      if (line.c - 1 >= 0) result.push({ r: line.r, c: line.c - 1 });
      if (line.c < BOXES) result.push({ r: line.r, c: line.c });
    }
    return result;
  }

  function countBoxSides(r, c){
    return boxCompleters(r, c).filter(isLineSet).length;
  }

  function getAllAvailableLines(){
    const lines = [];
    for (let r = 0; r < DOTS; r++){
      for (let c = 0; c < DOTS - 1; c++){
        if (!hLines[r][c]) lines.push({ type: 'h', r, c });
      }
    }
    for (let r = 0; r < DOTS - 1; r++){
      for (let c = 0; c < DOTS; c++){
        if (!vLines[r][c]) lines.push({ type: 'v', r, c });
      }
    }
    return lines;
  }

  function playLine(line, owner){
    setLine(line, owner);
    let completedAny = false;
    boxesAffectedByLine(line).forEach(({r, c}) => {
      if (!boxes[r][c] && countBoxSides(r, c) === 4){
        boxes[r][c] = owner;
        scores[owner]++;
        completedAny = true;
      }
    });
    return completedAny;
  }

  function updateScoreboard(){
    scoreYouEl.textContent = 'Você: ' + scores.you;
    scoreCpuEl.textContent = 'Computador: ' + scores.cpu;
  }

  function renderGrid(){
    gridEl.innerHTML = '';

    // pontos
    for (let r = 0; r < DOTS; r++){
      for (let c = 0; c < DOTS; c++){
        const dot = document.createElement('div');
        dot.className = 'dot';
        dot.style.left = (c * CELL) + '%';
        dot.style.top = (r * CELL) + '%';
        gridEl.appendChild(dot);
      }
    }

    // preenchimento das caixas
    for (let r = 0; r < BOXES; r++){
      for (let c = 0; c < BOXES; c++){
        const fill = document.createElement('div');
        fill.className = 'box-fill' + (boxes[r][c] ? ' filled ' + boxes[r][c] : '');
        fill.style.left = (c * CELL + CELL * 0.12) + '%';
        fill.style.top = (r * CELL + CELL * 0.12) + '%';
        fill.style.width = (CELL * 0.76) + '%';
        fill.style.height = (CELL * 0.76) + '%';
        gridEl.appendChild(fill);
      }
    }

    // linhas horizontais
    for (let r = 0; r < DOTS; r++){
      for (let c = 0; c < DOTS - 1; c++){
        const owner = hLines[r][c];
        const line = document.createElement('div');
        line.className = 'line h' + (owner ? ' claimed ' + owner : '');
        line.style.left = (c * CELL + 2) + '%';
        line.style.top = (r * CELL) + '%';
        line.style.width = (CELL - 4) + '%';
        line.style.transform = 'translateY(-50%)';
        if (!owner){
          line.addEventListener('click', () => handleLineClick({ type: 'h', r, c }));
        }
        gridEl.appendChild(line);
      }
    }

    // linhas verticais
    for (let r = 0; r < DOTS - 1; r++){
      for (let c = 0; c < DOTS; c++){
        const owner = vLines[r][c];
        const line = document.createElement('div');
        line.className = 'line v' + (owner ? ' claimed ' + owner : '');
        line.style.left = (c * CELL) + '%';
        line.style.top = (r * CELL + 2) + '%';
        line.style.height = (CELL - 4) + '%';
        line.style.transform = 'translateX(-50%)';
        if (!owner){
          line.addEventListener('click', () => handleLineClick({ type: 'v', r, c }));
        }
        gridEl.appendChild(line);
      }
    }

    updateScoreboard();
  }

  function handleLineClick(line){
    if (!gameActive || busy || currentTurn !== 'you') return;
    if (isLineSet(line)) return;

    const completed = playLine(line, 'you');
    renderGrid();

    if (checkGameEnd()) return;

    if (completed){
      statusEl.textContent = 'Você fechou um quadrado! Jogue de novo';
      return; // joga de novo
    }

    currentTurn = 'cpu';
    statusEl.textContent = 'Vez do computador...';
    busy = true;
    setTimeout(computerTurn, 650);
  }

  function totalBoxes(){ return BOXES * BOXES; }

  function checkGameEnd(){
    if (scores.you + scores.cpu === totalBoxes()){
      gameActive = false;
      busy = false;
      if (scores.you > scores.cpu){
        statusEl.textContent = 'Você ganhou! ' + scores.you + ' a ' + scores.cpu;
      } else if (scores.cpu > scores.you){
        statusEl.textContent = 'O computador ganhou. ' + scores.cpu + ' a ' + scores.you + '. Tente de novo!';
      } else {
        statusEl.textContent = 'Empate! ' + scores.you + ' a ' + scores.cpu;
      }
      startBtn.textContent = 'Jogar de novo';
      return true;
    }
    return false;
  }

  // ---- IA simples do computador ----
  function rand(min, max){ return Math.random() * (max - min) + min; }
  function randInt(min, max){ return Math.floor(rand(min, max + 1)); }

  function computerTurn(){
    if (!gameActive) return;
    const available = getAllAvailableLines();

    // 1) prioridade: fechar uma caixa se possível (3 lados já feitos)
    const completing = available.filter(line => {
      return boxesAffectedByLine(line).some(({r, c}) => countBoxSides(r, c) === 3);
    });
    if (completing.length > 0){
      const choice = completing[randInt(0, completing.length - 1)];
      const completed = playLine(choice, 'cpu');
      renderGrid();
      if (checkGameEnd()) return;
      if (completed){
        setTimeout(computerTurn, 500); // joga de novo
        return;
      }
      finishComputerTurn();
      return;
    }

    // 2) evitar criar uma caixa com 3 lados (que o jogador possa fechar)
    const safe = available.filter(line => {
      return !boxesAffectedByLine(line).some(({r, c}) => countBoxSides(r, c) === 2);
    });

    const pool = safe.length > 0 ? safe : available;
    const choice = pool[randInt(0, pool.length - 1)];
    const completed = playLine(choice, 'cpu');
    renderGrid();
    if (checkGameEnd()) return;
    if (completed){
      setTimeout(computerTurn, 500);
      return;
    }
    finishComputerTurn();
  }

  function finishComputerTurn(){
    currentTurn = 'you';
    busy = false;
    statusEl.textContent = 'Sua vez!';
  }

  function startGame(){
    setupState();
    currentTurn = 'you';
    gameActive = true;
    busy = false;
    statusEl.textContent = 'Sua vez! Toque numa linha';
    startBtn.textContent = 'Reiniciar jogo';
    renderGrid();
  }

  startBtn.addEventListener('click', startGame);

  // desenho inicial estático
  setupState();
  renderGrid();
})();
</script>

</body>
</html>
