:root{--bg:#f6f4ef;--card:#fff;--text:#242424;--muted:#696969;--line:#ded9cf;--orange:#ef9f27;--blue:#378add;--red:#e24b4a;--green:#639922;--purple:#3c3489;--shadow:0 12px 34px #0002}[data-theme=dark]{--bg:#181a1f;--card:#23262d;--text:#f5f5f5;--muted:#b7bbc5;--line:#3b414c;--shadow:0 12px 34px #0006}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",sans-serif}body{padding:16px 10px;display:flex;justify-content:center}.card{width:min(100%,470px);background:var(--card);border-radius:24px;box-shadow:var(--shadow);padding:16px;position:relative}.theme{position:absolute;right:13px;top:13px;width:42px;height:42px;border:1px solid var(--line);border-radius:50%;background:var(--card);font-size:20px;cursor:pointer}h1{margin:2px 52px 4px 0;color:var(--purple);font-size:27px}.sub{color:var(--muted);font-size:13px;line-height:1.35;margin:0 45px 12px 0}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.stat,.badge{border:1px solid var(--line);border-radius:13px;text-align:center;padding:7px;background:color-mix(in srgb,var(--card) 92%,var(--blue) 8%)}.stat small,.badge small{display:block;font-size:10px;font-weight:800;color:var(--muted)}.stat b{font-size:18px}.status{min-height:42px;margin:9px 0;display:grid;place-items:center;text-align:center;border-radius:12px;padding:7px;background:color-mix(in srgb,var(--card) 88%,var(--orange) 12%);font-size:13px;font-weight:800}.shell{background:#080b16;padding:7px;border-radius:18px}canvas{display:block;width:100%;height:auto;aspect-ratio:380/420;border-radius:12px;background:#070a13;touch-action:none}.extra{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:9px}.badge b{font-size:13px}.controls{display:flex;justify-content:center;gap:7px;flex-wrap:wrap;margin-top:10px}.ctrl{min-width:52px;min-height:46px;border:1px solid var(--line);border-radius:13px;background:color-mix(in srgb,var(--card) 83%,var(--blue) 17%);colo </style></head><body><main class="card"><button id="theme" class="theme" aria-label="Tema">🌙</button><h1 id="title">Jogos Retrô</h1><p id="sub" class="sub"></p><div class="stats"><div class="stat"><small>PONTOS</small><b id="score">0</b></div><div class="stat"><small>VIDAS</small><b id="lives">● ● ●</b></div><div class="stat"><small>FASE</small><b id="phase">1</b></div></div><div id="status" class="status">Aperte “Iniciar jogo”.</div><div class="shell"><canvas id="game" width="380" height="420"></canvas></div><div class="extra"><div class="badge"><small id="extra1Label">OBJETIVO</small><b id="extra1">—</b></div><div class="badge"><small id="extra2Label">PROGRESSO</small><b id="extra2">—</b></div></div><div id="controls" class="controls"></div><div class="actions"><button id="start" class="btn start">Iniciar jogo</button><button id="pause" class="btn pause">Pausar</button></div><div id="help" class="help"></div><div class="best">Melhor pontuação: <b id="best">0</b></div></main><script>
"use strict";
const $=id=>document.getElementById(id),cv=$('game'),ctx=cv.getContext('2d'),clamp=(v,a,b)=>Math.max(a,Math.min(b,v));let AC=null;function beep(f=440,d=.06,t='square',v=.025){try{AC||=new(window.AudioContext||window.webkitAudioContext)();let o=AC.createOscillator(),g=AC.createGain();o.type=t;o.frequency.value=f;g.gain.value=v;o.connect(g);g.connect(AC.destination);o.start();g.gain.exponentialRampToValueAtTime(.0001,AC.currentTime+d);o.stop(AC.currentTime+d)}catch(e){}}
const meta={

let game=null,running=false,paused=false,last=0,raf=0,score=0,lives=3,phase=1,best=+(localStorage.getItem('retro-'+mode+'-best')||0);$('best').textContent=best;const keys={left:false,right:false,up:false,down:false,action:false};
function hud(){score=Math.max(0,Math.floor(score));$('score').textContent=score;$('lives').textContent='● '.repeat(lives).trim()||'—';$('phase').textContent=phase;$('best').textContent=best;if(score>best){best=score;localStorage.setItem('retro-'+mode+'-best',best);$('best').textContent=best}}
function label(a,b,c,d){$('extra1Label').textContent=a;$('extra1').textContent=b;$('extra2Label').textContent=c;$('extra2').textContent=d}
function status(s){$('status').textContent=s}function clear(){ctx.clearRect(0,0,380,420)}function end(win=false){running=false;cancelAnimationFrame(raf);status((win?'🏆 Missão completa! ':'Fim da rodada! ')+score+' pontos.');hud()}
function lose(msg){lives--;beep(100,.18,'sawtooth',.045);status(msg);if(lives<=0)end(false);hud()}
function controls(items,help){$('controls').innerHTML='';items.forEach(x=>{let b=document.createElement('button');b.type='button';b.className='ctrl'+(x.action?' action':'');b.textContent=x.label;b.dataset.k=x.k;$('controls').appendChild(b)});$('help').innerHTML=help;document.querySelectorAll('.ctrl').forEach(b=>{b.addEventListener('pointerdown',e=>{e.preventDefault();setKey(b.dataset.k,true)});['pointerup','pointercancel','pointerleave'].forEach(ev=>b.addEventListener(ev,()=>setKey(b.dataset.k,false)))})}
function setKey(k,v){if(k==='fire'&&v&&game&&game.fire)return game.fire();if(k==='jump'&&v&&game&&game.jump)return game.jump();if(k==='duck'){keys.down=v;if(game&&game.duck)game.duck(v);return}if(k in keys)keys[k]=v}
window.addEventListener('keydown',e=>{let m={ArrowLeft:'left',a:'left',A:'left',ArrowRight:'right',d:'right',D:'right',ArrowUp:'up',w:'up',W:'up',ArrowDown:'down',s:'down',S:'down'}[e.key];if(m){e.preventDefault();setKey(m,true)}if(e.code==='Space'){e.preventDefault();setKey(mode==='selva'?'jump':'fire',true)}});window.addEventListener('keyup',e=>{let m={ArrowLeft:'left',a:'left',A:'left',ArrowRight:'right',d:'right',D:'right',ArrowUp:'up',w:'up',W:'up',ArrowDown:'down',s:'down',S:'down'}[e.key];if(m)setKey(m,false)});
function loop(t){if(!running)return;let dt=Math.min(.033,(t-last)/1000||0);last=t;if(!paused&&game)game.update(dt);if(game)game.draw();hud();raf=requestAnimationFrame(loop)}

function makeEnduro(){controls([{label:'←',k:'left'},{label:'→',k:'right'}],'Use <span class="kbd">← →</span> ou <span class="kbd">A D</span>. No celular, use os botões.');let p,cars,spawn,overtake,road;function bounds(y){let q=y/420,h=58+112*q;return[190-h,190+h]}return{reset(){p={x:190,y:354,w:34,h:55};cars=[];spawn=.5;overtake=0;road=0;label('MISSÃO','10 ultrapassagens','PROGRESSO','0/10')},update(dt){let sp=120+phase*18;road+=sp*dt;p.x+=(keys.right-keys.left)*180*dt;let b=bounds(p.y);p.x=clamp(p.x,b[0]+20,b[1]-20);spawn-=dt;if(spawn<=0){let lanes=[0,1,2].sort(()=>Math.random()-.5),n=phase<3?1:(Math.random()<.55?2:1);for(let i=0;i<n;i++)cars.push({x:100+lanes[i]*90,y:-60,w:33,h:52,s:85+phase*9+Math.random()*25,c:['#e24b4a','#378add','#ef9f27','#639922'][i%4]});spawn=Math.max(.48,1.25-phase*.075)}for(let c of cars){c.y+=c.s*dt;if(!c.p&&c.y>p.y+45){c.p=1;overtake++;score+=25+phase*3;if(overtake>=10){overtake=0;if(phase<8){phase++;beep(880,.15,'triangle',.04);status('Fase '+phase+'!')}else score+=500}}if(Math.abs(c.x-p.x)<32&&Math.abs(c.y-p.y)<46){cars=[];p.x=190;lose('Batida! Volte para a pista.')}}cars=cars.filter(x=>x.y<480);label('MISSÃO','10 ultrapassagens','PROGRESSO',overtake+'/10')},draw(){let sky=['#8ed0ff','#7fc8ff','#f4a261','#111827','#aab5bf','#506070','#081323','#050816'][phase-1];ctx.fillStyle=sky;ctx.fillRect(0,0,380,420);ctx.fillStyle=phase>=4?'#27323d':'#6ea845';ctx.beginPath();ctx.moveTo(0,420);ctx.lineTo(130,0);ctx.lineTo(250,0);ctx.lineTo(380,420);ctx.fill();ctx.fillStyle='#30343b';ctx.beginPath();ctx.moveTo(55,420);ctx.lineTo(160,0);ctx.lineTo(220,0);ctx.lineTo(325,420);ctx.fill();ctx.strokeStyle='#fff';ctx.lineWidth=3;for(let k=0;k<10;k++){let y=((k*54+road)%540)-60,q=clamp(y/420,0,1),h=58+112*q;for(let s of[-1,1]){ctx.beginPath();ctx.moveTo(190+s*h/3,y);ctx.lineTo(190+s*h/3,y+10+18*q);ctx.stroke()}}for(let c of cars)car(c.x,c.y,c.c);car(p.x,p.y,'#f7d038');if(phase===5){ctx.fillStyle='#eef3f766';ctx.fillRect(0,0,380,420)}}}}
function car(x,y,col){ctx.fillStyle=col;ctx.fillRect(x-17,y-26,34,52);ctx.fillStyle='#101820';ctx.fillRect(x-10,y-18,20,12);ctx.fillRect(x-11,y+5,22,12)}
function makeRiver(){controls([{label:'←',k:'left'},{label:'ATIRAR',k:'fire',action:1},{label:'→',k:'right'}],'Mova com <span class="kbd">← →</span> e atire com <span class="kbd">Espaço</span>.');let p,en,bul,pick,spawn,scroll,fuel;let center=y=>190+Math.sin((scroll+y)*.008)*35+Math.sin((scroll+y)*.019)*12,half=y=>102+Math.sin((scroll+y)*.005)*18;return{reset(){p={x:190,y:335};en=[];bul=[];pick=[];spawn=.4;scroll=0;fuel=100;label('COMBUSTÍVEL','100%','OBJETIVO','seguir o rio')},fire(){if(running&&!paused){bul.push({x:p.x,y:p.y-20});beep(720,.04)}},update(dt){scroll+=(70+phase*12)*dt;p.x+=(keys.right-keys.left)*170*dt;fuel-=dt*(2.2+phase*.12);let c=center(p.y),h=half(p.y);if(p.x<c-h+12||p.x>c+h-12){p.x=190;en=[];lose('Você bateu na margem!')}spawn-=dt;if(spawn<=0){let c0=center(0),h0=half(0),r=Math.random();if(r<.68)en.push({x:c0+(Math.random()-.5)*h0*1.25,y:-25,s:65+phase*8,type:Math.random()<.55?'🚤':'🚁'});else pick.push({x:c0+(Math.random()-.5)*h0,y:-25,type:r<.9?'⛽':'⭐'});spawn=Math.max(.45,1.05-phase*.055)}for(let e of en)e.y+=e.s*dt;for(let q of pick)q.y+=(70+phase*12)*dt;for(let b of bul)b.y-=260*dt;for(let i=en.length-1;i>=0;i--){let e=en[i];if(Math.abs(p.x-e.x)<24&&Math.abs(p.y-e.y)<24){en.splice(i,1);lose('Cuidado com os inimigos!');continue}for(let j=bul.length-1;j>=0;j--)if(Math.abs(bul[j].x-e.x)<18&&Math.abs(bul[j].y-e.y)<18){bul.splice(j,1);en.splice(i,1);score+=80;break}}for(let i=pick.length-1;i>=0;i--){let q=pick[i];if(Math.abs(p.x-q.x)<22&&Math.abs(p.y-q.y)<24){if(q.type==='⛽')fuel=clamp(fuel+38,0,100);else score+=100;pick.splice(i,1);beep(880,.1,'triangle')}}en=en.filter(x=>x.y<460);pick=pick.filter(x=>x.y<460);bul=bul.filter(x=>x.y>-20);if(fuel<=0){fuel=60;p.x=190;lose('O combustível acabou!')}let np=Math.min(8,1+Math.floor(score/650));if(np>phase)phase=np;label('COMBUSTÍVEL',Math.round(fuel)+'%','OBJETIVO','seguir o rio')},draw(){ctx.fillStyle='#6cbf5b';ctx.fillRect(0,0,380,420);ctx.beginPath();for(let y=0;y<=420;y+=8){let c=center(y),h=half(y);y?ctx.lineTo(c-h,y):ctx.moveTo(c-h,y)}for(let y=420;y>=0;y-=8){let c=center(y),h=half(y);ctx.lineTo(c+h,y)}ctx.fillStyle='#287ab8';ctx.fill();ctx.font='24px serif';ctx.textAlign='center';for(let e of en)ctx.fillText(e.type,e.x,e.y);for(let q of pick)ctx.fillText(q.type,q.x,q.y);ctx.fillStyle='#fff176';for(let b of bul)ctx.fillRect(b.x-2,b.y-8,4,12);ctx.fillStyle='#f5f5f5';ctx.beginPath();ctx.moveTo(p.x,p.y-20);ctx.lineTo(p.x-15,p.y+15);ctx.lineTo(p.x,p.y+10);ctx.lineTo(p.x+15,p.y+15);ctx.fill()}}}
function makePolicia(){controls([{label:'←',k:'left'},{label:'↑',k:'up'},{label:'↓',k:'down'},{label:'→',k:'right'}],'Use as setas para correr e trocar de andar junto às escadas.');let p,t,tm,lads;let fy=f=>90+f*88;function ladder(up){let l=lads.find(x=>Math.abs(x.x-p.x)<22&&(up?x.b===p.f:x.a===p.f));if(l){p.f=up?l.a:l.b;p.x=l.x;keys[up?'up':'down']=false}}return{reset(){p={x:55,f:3};t={x:310,f:0,d:-1};tm=Math.max(22,46-phase*2);lads=[{x:95,a:0,b:1},{x:280,a:0,b:1},{x:170,a:1,b:2},{x:320,a:1,b:2},{x:70,a:2,b:3},{x:245,a:2,b:3}];label('TEMPO',Math.ceil(tm)+'s','MISSÃO','pegue o ladrão')},update(dt){p.x=clamp(p.x+(keys.right-keys.left)*(120+phase*8)*dt,30,350);if(keys.up)ladder(true);if(keys.down)ladder(false);t.x+=t.d*(72+phase*10)*dt;if(t.x<35||t.x>345){t.d*=-1;t.x=clamp(t.x,35,345);let a=lads.filter(l=>l.a===t.f||l.b===t.f);if(a.length&&Math.random()<.7){let l=a[Math.floor(Math.random()*a.length)];t.x=l.x;t.f=l.a===t.f?l.b:l.a}}if(p.f===t.f&&Math.abs(p.x-t.x)<24){score+=300+Math.ceil(tm)*5;if(phase<8){phase++;this.reset();status('Pegou! Fase '+phase+'.')}else end(true)}tm-=dt;if(tm<=0){this.reset();lose('O tempo acabou!')}label('TEMPO',Math.ceil(tm)+'s','MISSÃO','pegue o ladrão')},draw(){ctx.fillStyle='#121826';ctx.fillRect(0,0,380,420);for(let f=0;f<4;f++){ctx.fillStyle=f%2?'#38435d':'#2b3449';ctx.fillRect(24,fy(f),332,12)}ctx.strokeStyle='#f0c36b';ctx.lineWidth=4;for(let l of lads){ctx.beginPath();ctx.moveTo(l.x-10,fy(l.a)+12);ctx.lineTo(l.x-10,fy(l.b));ctx.moveTo(l.x+10,fy(l.a)+12);ctx.lineTo(l.x+10,fy(l.b));ctx.stroke()}ctx.font='25px serif';ctx.textAlign='center';ctx.fillText('👮',p.x,fy(p.f)-7);ctx.fillText('🦹',t.x,fy(t.f)-7)}}}
function makeSelva(){controls([{label:'PULAR ↑',k:'jump',action:1},{label:'ABAIXAR ↓',k:'duck',action:1}],'Pule com <span class="kbd">↑</span>/<span class="kbd">Espaço</span> e abaixe com <span class="kbd">↓</span>.');let p,obs,spawn,dist;return{reset(){p={y:320,vy:0,on:1,duck:0};obs=[];spawn=.8;dist=0;label('DISTÂNCIA','0 m','TESOUROS','💎 +100')},jump(){if(p.on){p.vy=-285;p.on=0;beep(520,.05)}},duck(v){p.duck=v},update(dt){if(keys.up)this.jump();let sp=100+phase*11;dist+=sp*dt;spawn-=dt;if(spawn<=0){let r=Math.random(),o={x:410};if(r<.28){o.t='pit';o.w=65}else if(r<.55){o.t='log'}else if(r<.78){o.t='snake'}else{o.t='branch'}obs.push(o);spawn=Math.max(.55,1.35-phase*.06)}p.vy+=680*dt;p.y+=p.vy*dt;if(p.y>=320){p.y=320;p.vy=0;p.on=1}for(let o of obs)o.x-=sp*dt;for(let o of obs){if(o.t==='pit'&&p.on&&Math.abs(o.x-72)<32){obs=[];lose('Você caiu no buraco!');break}if((o.t==='log'||o.t==='snake')&&Math.abs(o.x-72)<24&&p.y>295){obs=[];lose('Ops! Pule o obstáculo.');break}if(o.t==='branch'&&Math.abs(o.x-72)<26&&!p.duck){obs=[];lose('Abaixe dos galhos!');break}}obs=obs.filter(o=>o.x>-80);score+=sp*dt*.08;let np=Math.min(8,1+Math.floor(dist/1500));if(np>phase)phase=np;label('DISTÂNCIA',Math.floor(dist/10)+' m','TESOUROS','💎 +100')},draw(){ctx.fillStyle='#87ceeb';ctx.fillRect(0,0,380,420);ctx.fillStyle='#6ea845';ctx.fillRect(0,342,380,78);ctx.font='32px serif';for(let x=-((dist*.4)%90);x<430;x+=90)ctx.fillText('🌴',x,115);ctx.font='28px serif';for(let o of obs){if(o.t==='pit'){ctx.fillStyle='#111';ctx.fillRect(o.x-32,338,64,82)}else ctx.fillText(o.t==='log'?'🪵':o.t==='snake'?'🐍':'🌿',o.x,o.t==='branch'?285:337)}ctx.font=p.duck?'27px serif':'34px serif';ctx.fillText('🏃',72,p.y)}}}
