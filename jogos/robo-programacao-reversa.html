<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Para Onde o Robô Vai?</title>
<style>
  :root {
    --bg: #FFF8EC;
    --card-bg: #ffffff;
    --card-shadow: rgba(0,0,0,0.08);
    --title: #3C3489;
    --text-secondary: #888780;
    --text-primary: #2C2C2A;
    --btn-bg: #3C3489;
    --btn-bg-active: #26215C;
    --btn-text: #ffffff;
    --key-bg: #FAF8F2;
    --key-border: #E1DDCF;
    --key-text: #2C2C2A;
    --cell-bg: #FAF8F2;
    --cell-border: #E1DDCF;
    --cell-selected: #378ADD;
    --cell-correct: #639922;
    --cell-wrong: #E24B4A;
    --robot-start: rgba(55, 138, 221, 0.25);
    --arrow-chip-bg: #FAF8F2;
    --arrow-chip-border: #E1DDCF;
  }
  [data-theme="dark"] {
    --bg: #1C1B18;
    --card-bg: #26251F;
    --card-shadow: rgba(0,0,0,0.4);
    --title: #B4ACF2;
    --text-secondary: #A6A399;
    --text-primary: #F2F0E8;
    --btn-bg: #7F77DD;
    --btn-bg-active: #534AB7;
    --btn-text: #1C1B18;
    --key-bg: #322F28;
    --key-border: #47443B;
    --key-text: #F2F0E8;
    --cell-bg: #322F28;
    --cell-border: #47443B;
    --cell-selected: #5AA1E8;
    --cell-correct: #7BAF3A;
    --cell-wrong: #F09595;
    --robot-start: rgba(90, 161, 232, 0.3);
    --arrow-chip-bg: #322F28;
    --arrow-chip-border: #47443B;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0;
    padding: 0;
    min-height: 100%;
    background: var(--bg);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    transition: background .2s;
  }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 20px;
  }
  .card {
    position: relative;
    width: 100%;
    max-width: 440px;
    background: var(--card-bg);
    border-radius: 24px;
    box-shadow: 0 8px 30px var(--card-shadow);
    padding: 22px 20px 26px;
    text-align: center;
    transition: background .2s;
  }
  .theme-toggle {
    position: absolute;
    top: 16px;
    right: 16px;
    width: 38px;
    height: 38px;
    border-radius: 50%;
    border: 2px solid var(--key-border);
    background: var(--key-bg);
    color: var(--key-text);
    font-size: 18px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    touch-action: manipulation;
  }
  h1 {
    font-size: 21px;
    margin: 0 0 4px;
    color: var(--title);
  }
  .subtitle {
    font-size: 13px;
    color: var(--text-secondary);
    margin: 0 0 14px;
  }

  .stats {
    display: flex;
    justify-content: center;
    gap: 28px;
    margin-bottom: 12px;
  }
  .stat-label {
    font-size: 12px;
    color: var(--text-secondary);
    margin-bottom: 2px;
  }
  .stat-value {
    font-size: 22px;
    font-weight: 700;
    color: var(--text-primary);
  }

  .instruction-label {
    font-size: 13px;
    color: var(--text-secondary);
    margin-bottom: 8px;
  }
  .arrow-sequence {
    display: flex;
    justify-content: center;
    gap: 8px;
    margin-bottom: 16px;
    flex-wrap: wrap;
  }
  .arrow-chip {
    width: 42px;
    height: 42px;
    border-radius: 12px;
    background: var(--arrow-chip-bg);
    border: 2px solid var(--arrow-chip-border);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 22px;
    font-weight: 700;
    color: var(--title);
  }

  .status {
    font-size: 15px;
    font-weight: 600;
    color: var(--text-primary);
    min-height: 22px;
    margin-bottom: 12px;
  }

  .board-wrap {
    width: 100%;
    max-width: 320px;
    margin: 0 auto 18px;
  }
  .board {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    grid-template-rows: repeat(4, 1fr);
    gap: 5px;
    aspect-ratio: 1 / 1;
    position: relative;
  }
  .cell {
    position: relative;
    background: var(--cell-bg);
    border: 2px solid var(--cell-border);
    border-radius: 10px;
    cursor: pointer;
    touch-action: manipulation;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 22px;
  }
  .cell.robot-start { background: var(--robot-start); }
  .cell.selected { box-shadow: inset 0 0 0 3px var(--cell-selected); }
  .cell.correct { box-shadow: inset 0 0 0 3px var(--cell-correct); background: var(--cell-correct); }
  .cell.wrong { box-shadow: inset 0 0 0 3px var(--cell-wrong); background: var(--cell-wrong); }
  .cell.not-clickable { cursor: default; }

  .robot-icon {
    position: absolute;
    font-size: 22px;
    transition: left 0.35s ease-in-out, top 0.35s ease-in-out;
    pointer-events: none;
    z-index: 3;
  }

  .start-btn {
    width: 100%;
    padding: 15px;
    font-size: 17px;
    font-weight: 700;
    border-radius: 16px;
    border: none;
    background: var(--btn-bg);
    color: var(--btn-text);
    cursor: pointer;
    transition: background .15s, transform .1s;
    touch-action: manipulation;
  }
  .start-btn:active { transform: scale(0.97); background: var(--btn-bg-active); }
</style>
</head>
<body>

<div class="card">
  <button class="theme-toggle" id="theme-toggle" aria-label="Alternar modo escuro">🌙</button>
  <h1>Para Onde o Robô Vai?</h1>
  <p class="subtitle">Leia os comandos, pense no caminho e clique onde o robô vai parar</p>

  <div class="stats">
    <div>
      <div class="stat-label">Acertos</div>
      <div class="stat-value" id="score">0</div>
    </div>
    <div>
      <div class="stat-label">Desafio</div>
      <div class="stat-value" id="round">1</div>
    </div>
  </div>

  <div class="instruction-label">O robô começa no quadrado marcado e segue estes comandos:</div>
  <div class="arrow-sequence" id="arrow-sequence"></div>

  <div class="status" id="status">Toque em iniciar</div>

  <div class="board-wrap">
    <div class="board" id="board"></div>
  </div>

  <button class="start-btn" id="start">Iniciar jogo</button>
</div>

<script>
(function(){
  // Modo escuro
  const themeToggle = document.getElementById('theme-toggle');
  function applyTheme(theme){
    document.documentElement.setAttribute('data-theme', theme);
    themeToggle.textContent = theme === 'dark' ? '☀️' : '🌙';
    try { localStorage.setItem('roborevers-theme', theme); } catch(e) {}
  }
  let savedTheme = '';
  try { savedTheme = localStorage.getItem('roborevers-theme') || ''; } catch(e) {}
  if (savedTheme === 'dark' || (!savedTheme && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches)){
    applyTheme('dark');
  } else {
    applyTheme(savedTheme === 'dark' ? 'dark' : 'light');
  }
  themeToggle.addEventListener('click', () => {
    const current = document.documentElement.getAttribute('data-theme');
    applyTheme(current === 'dark' ? 'light' : 'dark');
  });

  const boardEl = document.getElementById('board');
  const arrowSeqEl = document.getElementById('arrow-sequence');
  const statusEl = document.getElementById('status');
  const startBtn = document.getElementById('start');
  const scoreEl = document.getElementById('score');
  const roundEl = document.getElementById('round');

  const SIZE = 4;
  const ARROWS = [
    { symbol: '↑', dr: -1, dc: 0 },
    { symbol: '↓', dr: 1, dc: 0 },
    { symbol: '←', dr: 0, dc: -1 },
    { symbol: '→', dr: 0, dc: 1 }
  ];

  let startCell = { r: 0, c: 0 };
  let sequence = [];
  let correctCell = { r: 0, c: 0 };
  let score = 0;
  let round = 0;
  let gameActive = false;
  let answered = false;

  function rand(min, max){ return Math.random() * (max - min) + min; }
  function randInt(min, max){ return Math.floor(rand(min, max + 1)); }

  function inBounds(r, c){ return r >= 0 && r < SIZE && c >= 0 && c < SIZE; }

  function generateChallenge(){
    const numArrows = randInt(3, 4);
    let r, c, seq, valid;

    let attempts = 0;
    do {
      attempts++;
      r = randInt(0, SIZE - 1);
      c = randInt(0, SIZE - 1);
      seq = [];
      let curR = r, curC = c;
      valid = true;
      for (let i = 0; i < numArrows; i++){
        const candidates = ARROWS.filter(a => inBounds(curR + a.dr, curC + a.dc));
        if (candidates.length === 0){ valid = false; break; }
        const chosen = candidates[randInt(0, candidates.length - 1)];
        seq.push(chosen);
        curR += chosen.dr;
        curC += chosen.dc;
      }
      if (valid){
        correctCell = { r: curR, c: curC };
      }
    } while (!valid && attempts < 200);

    startCell = { r, c };
    sequence = seq;
  }

  function renderArrowSequence(){
    arrowSeqEl.innerHTML = '';
    sequence.forEach(a => {
      const chip = document.createElement('div');
      chip.className = 'arrow-chip';
      chip.textContent = a.symbol;
      arrowSeqEl.appendChild(chip);
    });
  }

  function renderBoard(){
    boardEl.innerHTML = '';
    for (let r = 0; r < SIZE; r++){
      for (let c = 0; c < SIZE; c++){
        const cell = document.createElement('div');
        cell.className = 'cell' + (!gameActive ? ' not-clickable' : '');
        if (r === startCell.r && c === startCell.c){
          cell.classList.add('robot-start');
          cell.textContent = '🤖';
        }
        cell.addEventListener('click', () => handleCellClick(r, c));
        boardEl.appendChild(cell);
      }
    }
  }

  function cellCenter(r, c){
    const boardRect = boardEl.getBoundingClientRect();
    const cellSize = boardRect.width / SIZE;
    return {
      left: c * cellSize + cellSize/2,
      top: r * cellSize + cellSize/2,
      size: cellSize
    };
  }

  function handleCellClick(r, c){
    if (!gameActive || answered) return;
    answered = true;
    const isCorrect = r === correctCell.r && c === correctCell.c;
    animateRobotPath(isCorrect, r, c);
  }

  function animateRobotPath(isCorrect, clickedR, clickedC){
    Array.from(boardEl.children).forEach(cell => cell.style.pointerEvents = 'none');

    // esconde o emoji fixo da célula inicial, o robô animado vai por cima
    const startCellEl = boardEl.children[startCell.r * SIZE + startCell.c];
    if (startCellEl) startCellEl.textContent = '';

    const robotIcon = document.createElement('div');
    robotIcon.className = 'robot-icon';
    robotIcon.textContent = '🤖';
    boardEl.appendChild(robotIcon);

    let pos = { r: startCell.r, c: startCell.c };
    function placeRobot(){
      const center = cellCenter(pos.r, pos.c);
      robotIcon.style.left = (center.left - center.size*0.28) + 'px';
      robotIcon.style.top = (center.top - center.size*0.28) + 'px';
      robotIcon.style.fontSize = (center.size * 0.55) + 'px';
    }
    placeRobot();

    let step = 0;
    function nextStep(){
      if (step >= sequence.length){
        const clickedCellEl = boardEl.children[clickedR * SIZE + clickedC];
        if (clickedCellEl) clickedCellEl.classList.add(isCorrect ? 'correct' : 'wrong');

        if (!isCorrect){
          const correctCellEl = boardEl.children[correctCell.r * SIZE + correctCell.c];
          if (correctCellEl) correctCellEl.classList.add('correct');
        }

        if (isCorrect){
          score++;
          scoreEl.textContent = score;
          statusEl.textContent = 'Isso mesmo! O robô parou exatamente aí! 🎉';
        } else {
          statusEl.textContent = 'Quase! O robô parou no quadrado verde. Vamos tentar outro!';
        }

        setTimeout(() => {
          robotIcon.remove();
          nextRound();
        }, 1600);
        return;
      }

      const arrow = sequence[step];
      pos = { r: pos.r + arrow.dr, c: pos.c + arrow.dc };
      placeRobot();
      step++;
      setTimeout(nextStep, 450);
    }

    setTimeout(nextStep, 300);
  }

  function nextRound(){
    round++;
    roundEl.textContent = round;
    generateChallenge();
    answered = false;
    statusEl.textContent = 'Para onde o robô vai parar?';
    renderArrowSequence();
    renderBoard();
  }

  function startGame(){
    score = 0;
    round = 0;
    scoreEl.textContent = '0';
    gameActive = true;
    startBtn.textContent = 'Jogando...';
    startBtn.disabled = true;
    nextRound();
  }

  startBtn.addEventListener('click', startGame);

  // desenho inicial estático
  generateChallenge();
  renderArrowSequence();
  renderBoard();
})();
</script>

</body>
</html>
