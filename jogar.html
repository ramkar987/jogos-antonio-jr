<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Abrindo jogo…</title><style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f7f5ef;color:#292622;font:16px system-ui,sans-serif}.box{text-align:center;padding:28px}.spin{font-size:42px;animation:s 1s linear infinite}@keyframes s{to{transform:rotate(360deg)}}.err{max-width:600px;color:#9b2c2c}</style></head><body><div class="box"><div class="spin">🎮</div><p id="msg">Abrindo o jogo…</p></div><script>(async()=>{const msg=document.getElementById('msg');try{const key=new URLSearchParams(location.search).get('j');if(!key||!/^[a-z0-9_]+$/.test(key))throw new Error('Jogo não informado.');const r=await fetch(`data/${key}.gz.b64`,{cache:'no-cache'});if(!r.ok)throw new Error('Jogo não encontrado.');const b64=(await r.text()).trim();const bin=atob(b64),bytes=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)bytes[i]=bin.charCodeAt(i);if(!('DecompressionStream'in window))throw new Error('Este navegador não suporta a descompactação necessária. Atualize o navegador.');const stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));const html=await new Response(stream).text();document.open();document.write(html);document.close()}catch(e){document.querySelector('.spin').textContent='😕';msg.className='err';msg.textContent=`Não foi possível abrir o jogo: ${e.message}`}})();</script></body></html>
